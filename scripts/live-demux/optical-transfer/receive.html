<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fc optical blur · RX</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --acc:#22d3ee; --dim:#8b949e; --ok:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, sans-serif; padding:16px; }
  h1 { font-size:1rem; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  button, select, input { background:#161b22; color:var(--fg); border:1px solid #30363d;
    border-radius:6px; padding:8px 10px; font-size:13px; }
  button.primary { background:#238636; border-color:#2ea043; font-weight:700; }
  #vwrap { position:relative; max-width:720px; background:#000; border-radius:10px; overflow:hidden; }
  video, canvas { width:100%; display:block; }
  canvas#overlay { position:absolute; inset:0; pointer-events:none; }
  #stats { font-family: ui-monospace, monospace; font-size:12px; color:var(--acc); white-space:pre-wrap; }
  #out { margin-top:10px; background:#161b22; border:1px solid #30363d; border-radius:8px;
    padding:10px; min-height:48px; font-family:ui-monospace,monospace; font-size:12px; }
  .hint { color:var(--dim); font-size:12px; max-width:640px; line-height:1.4; }
</style>
</head>
<body>
  <h1>fc optical receive · jawta light + fountain peel</h1>
  <p class="hint">
    Point camera at <b>send.html</b> (blur / QR / light). Light mode tracks mean luminance (jawta OOK).
    QR mode needs BarcodeDetector or paste frames. Progress tracks <b>frames collected</b>, not blocks solved.
  </p>
  <div class="row">
    <select id="mode">
      <option value="light">light · luminance OOK</option>
      <option value="qr">qr · BarcodeDetector</option>
    </select>
    <button id="start" class="primary">Start camera</button>
    <button id="stop">Stop</button>
    <label>thresh <input id="thresh" type="number" value="120" style="width:64px" /></label>
  </div>
  <div id="vwrap">
    <video id="v" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>
  <canvas id="sample" width="160" height="120" style="display:none"></canvas>
  <div id="stats">idle</div>
  <div id="out">decoded…</div>
<script src="shared.js"></script>
<script>
(function () {
  const OT = window.OpticalTransfer;
  const v = document.getElementById("v");
  const sample = document.getElementById("sample");
  const sctx = sample.getContext("2d", { willReadFrequently: true });
  const overlay = document.getElementById("overlay");
  const octx = overlay.getContext("2d");
  const stats = document.getElementById("stats");
  const out = document.getElementById("out");
  const threshEl = document.getElementById("thresh");
  const modeEl = document.getElementById("mode");

  let stream = null;
  let loop = 0;
  let marks = []; // {t, on}
  let lastOn = 0;
  let edgeT = 0;
  let ditEst = 80;
  let morseBuf = "";
  let decoder = null;
  let expectFnv = null;
  let bd = null;

  if ("BarcodeDetector" in window) {
    try { bd = new BarcodeDetector({ formats: ["qr_code"] }); } catch (_) {}
  }

  async function start() {
    stop();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, frameRate: { ideal: 30 } },
      audio: false,
    });
    v.srcObject = stream;
    await v.play();
    overlay.width = v.videoWidth || 640;
    overlay.height = v.videoHeight || 480;
    tick();
  }

  function stop() {
    cancelAnimationFrame(loop);
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    stats.textContent = "stopped";
  }

  function meanLuma() {
    const w = sample.width, h = sample.height;
    sctx.drawImage(v, 0, 0, w, h);
    const img = sctx.getImageData(0, 0, w, h).data;
    let s = 0, n = 0;
    for (let i = 0; i < img.length; i += 16) {
      s += 0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2];
      n++;
    }
    return s / n;
  }

  function onMorseEdge(on, t) {
    if (on === lastOn) return;
    const dur = t - edgeT;
    edgeT = t;
    if (lastOn === 1) {
      // mark ended
      if (dur < ditEst * 2) morseBuf += ".";
      else morseBuf += "-";
      ditEst = ditEst * 0.8 + (dur < ditEst * 2 ? dur : dur / 3) * 0.2;
    } else if (lastOn === 0 && dur > ditEst * 2.5) {
      morseBuf += " ";
    }
    lastOn = on;
    out.textContent = "light stream: " + morseBuf.slice(-80);
  }

  async function tick() {
    loop = requestAnimationFrame(tick);
    if (!stream) return;
    const mode = modeEl.value;
    const t = performance.now();
    if (mode === "light") {
      const m = meanLuma();
      const on = m > Number(threshEl.value) ? 1 : 0;
      onMorseEdge(on, t);
      // overlay
      octx.clearRect(0, 0, overlay.width, overlay.height);
      octx.fillStyle = on ? "rgba(251,191,36,0.25)" : "rgba(0,0,0,0.15)";
      octx.fillRect(0, 0, overlay.width, overlay.height);
      stats.textContent = `light · luma=${m.toFixed(1)} on=${on} dit≈${ditEst.toFixed(0)}ms`;
      return;
    }
    // QR path
    if (bd) {
      try {
        const codes = await bd.detect(v);
        if (codes && codes.length) {
          const raw = codes[0].rawValue || "";
          // try base64 payload from send.html
          try {
            const bin = Uint8Array.from(atob(raw), (c) => c.charCodeAt(0));
            const parsed = OT.parseFrame(bin);
            if (parsed) {
              const { header, block } = parsed;
              if (!decoder || decoder.sessionId !== header.sessionId) {
                decoder = new OT.LTDecoder(header.k, header.blockLen, header.sessionId, header.totalLen);
                expectFnv = header.payloadFnv;
              }
              decoder.addFrame(header.seq, block);
              stats.textContent =
                `qr · frames=${decoder.framesNew} solved=${decoder.solvedCount}/${decoder.k} seq=${header.seq}`;
              if (decoder.isComplete) {
                const data = decoder.assemble();
                const ok = OT.fnv1a(data) === expectFnv;
                const text = new TextDecoder().decode(data);
                out.textContent = (ok ? "OK " : "FNV FAIL ") + text.slice(0, 500);
                stats.textContent += " · COMPLETE";
              }
            } else {
              out.textContent = "QR text: " + raw.slice(0, 200);
            }
          } catch (_) {
            out.textContent = "QR: " + raw.slice(0, 200);
          }
        } else {
          stats.textContent = "qr · scanning… (no code)";
        }
      } catch (e) {
        stats.textContent = "qr error " + e;
      }
    } else {
      stats.textContent = "no BarcodeDetector — use Safari? try light mode or Chrome";
    }
  }

  document.getElementById("start").onclick = () => start().catch((e) => {
    stats.textContent = String(e);
  });
  document.getElementById("stop").onclick = stop;
})();
</script>
</body>
</html>
