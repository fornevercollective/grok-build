<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jawta light TX</title>
<style>
  html, body { margin:0; height:100%; background:#050510; color:#e6edf3;
    font-family: system-ui, sans-serif; }
  #beam { position:fixed; inset:0; background:#050510; transition: background .02s linear; }
  #hud { position:fixed; left:12px; right:12px; bottom:12px; z-index:2;
    background:rgba(13,17,23,.9); border:1px solid #30363d; border-radius:10px;
    padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; }
  input, button { background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:6px; padding:6px 10px; }
  button.primary { background:#238636; border-color:#2ea043; font-weight:700; }
  #status { font-family: ui-monospace, monospace; color:#fbbf24; flex:1; }
  #morse { position:fixed; top:12px; left:12px; right:12px; text-align:center;
    font-family: ui-monospace, monospace; color:#8b949e; font-size:14px; letter-spacing:2px; z-index:2; }
</style>
</head>
<body>
<div id="beam"></div>
<div id="morse"></div>
<div id="hud">
  <span>jawta light · optical TX</span>
  <input id="text" size="28" value="SOS" />
  <label>wpm <input id="wpm" type="number" value="15" style="width:48px" /></label>
  <button id="tx" class="primary">Transmit</button>
  <button id="stop">Stop</button>
  <span id="status">idle</span>
</div>
<script src="shared.js"></script>
<script>
(function () {
  const OT = OpticalTransfer;
  const params = new URLSearchParams(location.search);
  const textEl = document.getElementById("text");
  const wpmEl = document.getElementById("wpm");
  const beam = document.getElementById("beam");
  const status = document.getElementById("status");
  const morseEl = document.getElementById("morse");
  if (params.get("text")) textEl.value = decodeURIComponent(params.get("text"));
  if (params.get("wpm")) wpmEl.value = params.get("wpm");
  let timers = [];
  let looping = params.get("loop") === "1";

  function stop() {
    timers.forEach(clearTimeout);
    timers = [];
    beam.style.background = "#050510";
    status.textContent = "idle";
  }

  function tx() {
    stop();
    const text = textEl.value || "V";
    const wpm = Number(wpmEl.value) || 15;
    const morse = OT.textToMorse(text);
    const events = OT.morseTimeline(morse, wpm);
    morseEl.textContent = morse;
    status.textContent = `TX · ${text} · ${events.length} marks`;
    const t0 = performance.now();
    events.forEach((e) => {
      timers.push(setTimeout(() => {
        beam.style.background = "#fbbf24";
        status.textContent = e.dur < OT.ditMs(wpm) * 2 ? "DIT" : "DAH";
      }, e.start));
      timers.push(setTimeout(() => {
        beam.style.background = "#050510";
        status.textContent = "gap";
      }, e.start + e.dur));
    });
    const total = events.length
      ? events[events.length - 1].start + events[events.length - 1].dur
      : 0;
    timers.push(setTimeout(() => {
      status.textContent = "done";
      if (looping || params.get("loop") === "1") tx();
    }, total + 50));
  }

  document.getElementById("tx").onclick = tx;
  document.getElementById("stop").onclick = () => { looping = false; stop(); };
  if (params.get("text") || params.get("auto") === "1") tx();
})();
</script>
</body>
</html>
