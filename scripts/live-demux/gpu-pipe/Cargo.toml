[package]
name = "fc-gpu-pipe"
version = "0.1.0"
edition = "2021"
description = "Throttle bare-metal GPU encode on laptop; pipe H.264 to Cast TV (bypass DashCast WebGL)"
license = "MIT"
publish = false

# Standalone (not monorepo workspace member)
[workspace]

[[bin]]
name = "fc-gpu-pipe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
