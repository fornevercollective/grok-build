<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05070c" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>GrokCast · TV native</title>
  <style>
    :root {
      --bg: #05070c;
      --ink: #e8eef6;
      --mute: #7a8a9a;
      --line: #1c2838;
      --accent: #50c8ff;
      --hot: #ffdc50;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 5;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 40%, #0c1828, #05070c 70%);
      text-align: center; padding: 2rem;
    }
    #boot h1 { font: 800 1.4rem system-ui; letter-spacing: .06em; color: var(--accent); }
    #boot p { margin-top: .6rem; color: var(--mute); font: 500 0.95rem ui-monospace, monospace; max-width: 36rem; line-height: 1.45; }
    #boot .pill {
      display: inline-block; margin-top: 1rem; padding: .35rem .75rem;
      border: 1px solid #2a6a96; border-radius: 999px; color: var(--ok);
      font: 600 12px ui-monospace, monospace;
    }
    #frame {
      position: absolute; inset: 0; border: 0; width: 100%; height: 100%;
      background: #000;
    }
    #chrome {
      position: fixed; left: 12px; top: 10px; z-index: 4;
      font: 600 11px ui-monospace, monospace;
      padding: 4px 10px; border-radius: 4px;
      background: rgba(0,0,0,.55); color: var(--mute);
      pointer-events: none;
      opacity: .85;
    }
    #chrome.ok { color: var(--ok); }
    #chrome.warn { color: var(--hot); }
    body.ready #boot { display: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <h1>GROKCAST · TV NATIVE</h1>
      <p>
        Decode runs on this panel (Google TV WebView). The desk Mac only sends
        light commands — mode, PGM, quality, pause — not full multi-stream encode.
      </p>
      <p id="bootStatus">loading stream plan…</p>
      <div class="pill" id="bootPill">fc-stream-policy-v1</div>
    </div>
  </div>
  <div id="chrome">TV · connecting</div>
  <iframe id="frame" title="GrokCast news wall" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
<script>
(function () {
  'use strict';
  // TV-native shell: host the news wall in role=tv with tv-native budget.
  // Control machine: POST /api/stream/cmd {cmd, ...} for minor tweaks.
  const status = document.getElementById('bootStatus');
  const chrome = document.getElementById('chrome');
  const frame = document.getElementById('frame');
  const pill = document.getElementById('bootPill');
  let lastCmdSeq = 0;
  let lastReload = null;

  async function loadPlan() {
    try {
      const r = await fetch('/api/stream/plan?role=tv&mode=tv-native&_=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('plan ' + r.status);
      const plan = await r.json();
      const b = plan.budget || {};
      status.textContent =
        (plan.mode_label || plan.mode) +
        ' · live budget ' + (b.live_used || 0) + '/' + (b.max_live || '?') +
        ' · ~' + (b.estimate_mbps || 0) + ' Mbps' +
        ' · tile ' + (plan.panel && plan.panel.tile_w) + '×' + (plan.panel && plan.panel.tile_h);
      pill.textContent = 'offload ' + (plan.offload || 'tv') + ' · ' + (plan.mode || 'tv-native');
      chrome.textContent = 'TV native · ' + (plan.mode || 'tv-native') + ' · max_live ' + (b.max_live || '?');
      chrome.className = 'ok';
      return plan;
    } catch (e) {
      status.textContent = 'plan error: ' + e.message;
      chrome.textContent = 'TV · plan fail';
      chrome.className = 'warn';
      return null;
    }
  }

  function mountWall() {
    // news wall owns L3, catalog, embeds — forced tv + pwa flags
    const src = '/news?tv=1&pwa=1&role=tv&shell=1&_=' + Date.now();
    frame.src = src;
    document.body.classList.add('ready');
  }

  async function pollCmds() {
    try {
      const r = await fetch('/api/stream/cmd?_=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const data = await r.json();
      const tc = data.tv_cmd || {};
      if (tc.reload_token != null && lastReload != null && tc.reload_token !== lastReload) {
        lastReload = tc.reload_token;
        // soft remount wall iframe (cheaper than full shell reload when possible)
        mountWall();
        return;
      }
      lastReload = tc.reload_token;
      if (tc.cmd_seq && tc.cmd_seq !== lastCmdSeq) {
        lastCmdSeq = tc.cmd_seq;
        chrome.textContent = 'TV · cmd ' + (tc.last_cmd || '') + ' · seq ' + lastCmdSeq;
        // news iframe polls the same API — just refresh chrome here
        loadPlan();
      }
    } catch (_) {}
  }

  // service worker for installable TV PWA (when served over HTTPS)
  if (window.isSecureContext && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
  }

  loadPlan().then(function () {
    mountWall();
  });
  setInterval(pollCmds, 900);
  setInterval(loadPlan, 15000);
})();
</script>
</body>
</html>
