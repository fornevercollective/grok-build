<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GrokCast" />
  <meta name="theme-color" content="#07090e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>GrokCast · BOX control</title>
  <style>
    :root {
      --bg: #030508;
      --ink: #e8f0f8;
      --grid: rgba(120, 200, 255, 0.22);
      --grid-hot: rgba(255, 220, 80, 0.85);
      --safe: rgba(40, 200, 120, 0.55);
      --cube: rgba(180, 230, 255, 0.75);
      --glass: rgba(200, 240, 255, 0.08);
      --forest: #0a1a12;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, monospace; overflow: hidden; }
    body.tv #bar { display: none; }
    #bar {
      position: fixed; z-index: 50; inset: 0 auto auto 0; right: 0;
      display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
      padding: .45rem .65rem; background: rgba(6,8,12,.94); border-bottom: 1px solid #1a2430;
      font-size: .72rem;
    }
    #bar button {
      background: #142030; color: var(--ink); border: 1px solid #2a4058;
      border-radius: 5px; padding: .3rem .55rem; font: inherit; cursor: pointer;
    }
    #bar button.primary { background: #1a3850; border-color: #3a80b0; }
    #bar button.active { border-color: #ffdc50; color: #ffdc50; }
    #bar .meta { margin-left: auto; color: #7a90a8; font-variant-numeric: tabular-nums; }
    #world {
      position: absolute; inset: 0;
      perspective: 1100px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 35%, #0c1a14 0%, #050a08 45%, #020406 100%);
    }
    /* forest / plant plate — living drift (no cam spool) */
    #forest {
      position: absolute; inset: -8%;
      background:
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(20, 80, 40, .45), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 70%, rgba(30, 90, 50, .35), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(10, 40, 20, .6), transparent 60%),
        linear-gradient(180deg, #061018 0%, #0a140e 55%, #030806 100%);
      will-change: transform;
      animation: forestDrift 28s ease-in-out infinite alternate;
    }
    #canopy {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(ellipse 12% 18% at 15% 20%, rgba(40, 120, 60, .25), transparent),
        radial-gradient(ellipse 18% 22% at 78% 15%, rgba(30, 100, 50, .22), transparent),
        radial-gradient(ellipse 14% 16% at 55% 8%, rgba(50, 130, 70, .18), transparent);
      pointer-events: none;
      will-change: transform;
      animation: canopyBreathe 18s ease-in-out infinite alternate;
    }
    @keyframes canopyBreathe {
      from { filter: brightness(0.95) saturate(1.05); }
      to   { filter: brightness(1.08) saturate(1.2); }
    }
    @keyframes forestDrift {
      from { filter: hue-rotate(-4deg); }
      to   { filter: hue-rotate(8deg); }
    }
    /* infinite mirror / scroll tunnel behind center */
    #tunnel {
      position: absolute; left: 50%; top: 50%;
      width: min(52vw, 920px); height: min(52vh, 520px);
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      overflow: hidden;
      border-radius: 6px;
      will-change: transform;
    }
    #tunnel-scroll {
      position: absolute; inset: -50%;
      background:
        repeating-linear-gradient(180deg,
          transparent 0 28px,
          rgba(80, 200, 255, .06) 28px 29px),
        repeating-linear-gradient(90deg,
          transparent 0 40px,
          rgba(80, 200, 255, .04) 40px 41px),
        radial-gradient(ellipse at center, #102030 0%, #050a10 70%);
      animation: scrollY 14s linear infinite;
      opacity: .85;
    }
    @keyframes scrollY {
      from { transform: translateY(0); }
      to { transform: translateY(29px); }
    }
    #tunnel-mirror {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.07), transparent 30%, transparent 70%, rgba(0,0,0,.35)),
        linear-gradient(90deg, rgba(0,0,0,.4), transparent 20%, transparent 80%, rgba(0,0,0,.4));
      box-shadow: inset 0 0 80px rgba(0,0,0,.55);
      pointer-events: none;
    }
    /* center video loop */
    #portal {
      position: absolute; left: 50%; top: 50%;
      width: min(42vw, 760px); height: min(42vh, 428px);
      transform: translate(-50%, -50%);
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(180, 230, 255, .45),
        0 0 40px rgba(80, 180, 255, .2),
        0 25px 80px rgba(0,0,0,.65);
      will-change: transform;
      z-index: 5;
    }
    #portal video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }
    #portal .chrome {
      position: absolute; left: 8px; top: 6px; z-index: 2;
      font-size: 11px; letter-spacing: .04em;
      color: rgba(200, 240, 255, .85);
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }
    /* glass shader overlay (npm_i_shaders vibe) */
    #glass {
      position: absolute; inset: 0; z-index: 8; pointer-events: none;
      background:
        linear-gradient(125deg, rgba(255,255,255,.07) 0%, transparent 32%, transparent 68%, rgba(120,200,255,.05) 100%),
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 40%);
      mix-blend-mode: screen;
      will-change: transform;
    }
    /* full align grid */
    #grid-canvas {
      position: absolute; inset: 0; z-index: 10;
      width: 100%; height: 100%;
      pointer-events: none;
      opacity: .92;
    }
    /* BOX depth cube */
    #cube-wrap {
      position: absolute; left: 50%; top: 50%;
      width: 0; height: 0; z-index: 12;
      transform-style: preserve-3d;
      pointer-events: none;
      will-change: transform;
    }
    .cube {
      position: absolute; left: 0; top: 0;
      width: 220px; height: 220px;
      margin: -110px 0 0 -110px;
      transform-style: preserve-3d;
    }
    .face {
      position: absolute; width: 220px; height: 220px;
      border: 1.5px solid var(--cube);
      background: rgba(80, 160, 255, 0.04);
      box-shadow: inset 0 0 30px rgba(100, 200, 255, .08);
    }
    .face.f { transform: translateZ(110px); }
    .face.b { transform: rotateY(180deg) translateZ(110px); opacity: .45; }
    .face.l { transform: rotateY(-90deg) translateZ(110px); opacity: .65; }
    .face.r { transform: rotateY(90deg) translateZ(110px); opacity: .65; }
    .face.u { transform: rotateX(90deg) translateZ(110px); opacity: .5; }
    .face.d { transform: rotateX(-90deg) translateZ(110px); opacity: .5; }
    .face.wire {
      background:
        linear-gradient(rgba(180,230,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,230,255,.12) 1px, transparent 1px);
      background-size: 20% 20%;
    }
    /* variation modes */
    body.var-op .face { border-color: #fff; background: rgba(255,255,255,.03); }
    body.var-op #tunnel-scroll { filter: grayscale(1) contrast(1.2); }
    body.var-neon .face { border-color: #ff40c8; box-shadow: 0 0 20px #ff40c888; }
    body.var-neon #portal { box-shadow: 0 0 0 1px #ff40c8, 0 0 50px #ff40c866; }
    body.var-forest #forest { filter: saturate(1.4) brightness(1.1); }
    body.var-forest .face { border-color: #60ff90; }
    #hud {
      position: absolute; left: 14px; bottom: 12px; z-index: 20;
      font-size: 12px; color: #8ec8ff; text-shadow: 0 1px 3px #000; opacity: .9;
    }
    body.tv #hud { font-size: 15px; left: 22px; bottom: 20px; }
    #err {
      position: absolute; left: 50%; top: 12%; transform: translateX(-50%);
      z-index: 30; background: rgba(40,10,10,.9); color: #ffb0b0;
      padding: .5rem .8rem; border-radius: 6px; font-size: .8rem; display: none;
    }
    /* live camera tiles mapped to grid cells */
    #cam-layer {
      position: absolute; inset: 0; z-index: 6;
      pointer-events: none;
      will-change: transform;
    }
    .cam-tile {
      position: absolute;
      overflow: hidden;
      border: 1.5px solid rgba(120, 220, 255, .55);
      border-radius: 3px;
      box-shadow: 0 0 20px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.25);
      background: #0a1018;
    }
    .cam-tile img, .cam-tile video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* selfie mirror for local cams */
    }
    .cam-tile .tag {
      position: absolute; left: 6px; top: 4px;
      font-size: 10px; letter-spacing: .03em;
      color: rgba(220,245,255,.9);
      text-shadow: 0 1px 3px #000;
      background: rgba(0,0,0,.35);
      padding: 1px 5px; border-radius: 3px;
    }
    .cam-tile.phone img { transform: none; }
    #preview {
      position: fixed; right: 10px; bottom: 10px; z-index: 40;
      width: 140px; height: 100px; border-radius: 6px; overflow: hidden;
      border: 1px solid #3a5068; display: none; background: #000;
    }
    #preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    body.tv #preview { display: none !important; }
    /* horizon + vantage guides */
    #horizon {
      position: absolute; left: 0; right: 0; height: 0; z-index: 15;
      border-top: 1.5px dashed rgba(255, 200, 80, .75);
      pointer-events: none;
      box-shadow: 0 0 12px rgba(255, 180, 40, .35);
    }
    #horizon .label {
      position: absolute; left: 12px; top: -16px;
      font-size: 11px; color: rgba(255,220,120,.9);
      text-shadow: 0 1px 2px #000;
    }
    #color-plate {
      position: absolute; inset: 8% 18%; z-index: 4;
      display: none; border-radius: 6px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 20px 60px #000a;
    }
    body.color-on #color-plate { display: grid; }
    body.color-on #portal { opacity: .15; }
    #color-plate .swatch {
      display: grid; place-items: end start;
      padding: 8px; font-size: 11px; color: #fff;
      text-shadow: 0 1px 2px #000;
      min-height: 48px;
    }
    .sync-ok { color: #4dff9a !important; }
    .sync-bad { color: #ff6b6b !important; }
    /* QR → phone Grok remote / cast control (LAN hub; whitespace glyph is separate) */
    #glyph-qr {
      position: absolute; z-index: 18;
      right: 2.2%; bottom: 3.5%;
      width: min(22vw, 240px);
      background: #fff;
      border-radius: 10px;
      padding: 10px 10px 8px;
      box-shadow: 0 0 0 2px rgba(110, 231, 183, .55), 0 12px 40px rgba(0,0,0,.55);
      text-align: center;
      pointer-events: none;
    }
    #glyph-qr img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    #glyph-qr .g-title {
      font: 700 11px system-ui, sans-serif; color: #042f1a;
      margin: 6px 0 2px; letter-spacing: .02em;
    }
    #glyph-qr .g-url {
      font: 500 9px ui-monospace, monospace; color: #1a5c40;
      word-break: break-all; line-height: 1.25;
    }
    #glyph-qr .g-mode {
      font: 600 9px system-ui; color: #0d1117; opacity: .7; margin-top: 3px;
    }
    body.control #glyph-qr { width: min(28vw, 160px); right: 8px; bottom: 120px; }
    body.tv #glyph-qr { bottom: 108px; }
    /* L4 lower thirds — broadcast info: timesync + program bug + live transcript */
    #l3 {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      pointer-events: none;
      padding: 0 0 env(safe-area-inset-bottom, 0);
      background:
        linear-gradient(0deg, rgba(2,4,8,.94) 0%, rgba(2,4,8,.82) 55%, transparent 100%);
      border-top: 1px solid rgba(80, 160, 220, .18);
    }
    #l3-inner {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 16px;
      align-items: end;
      padding: 10px 16px 12px;
      max-width: 100%;
    }
    body.tv #l3-inner { padding: 14px 22px 16px; gap: 12px 22px; }
    body.control #l3 { pointer-events: auto; }
    #l3-bug {
      flex: 0 0 auto;
      min-width: 7.5rem;
      padding: 6px 10px 7px;
      border-radius: 4px 4px 4px 0;
      background: linear-gradient(135deg, #0c2838, #081018);
      border: 1px solid #2a6a96;
      border-left: 3px solid #50c8ff;
      box-shadow: 0 4px 18px #000a;
    }
    #l3-bug .show {
      font: 800 11px system-ui, sans-serif;
      letter-spacing: .08em;
      color: #50c8ff;
      text-transform: uppercase;
    }
    #l3-bug .slug {
      font: 600 13px ui-monospace, monospace;
      color: #ffe65a;
      margin-top: 2px;
    }
    body.tv #l3-bug .show { font-size: 13px; }
    body.tv #l3-bug .slug { font-size: 16px; }
    #l3-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    #l3-timesync {
      font: 600 12px ui-monospace, monospace;
      color: #9ad4ff;
      letter-spacing: .03em;
      text-shadow: 0 1px 3px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    body.tv #l3-timesync { font-size: 15px; }
    #l3-timesync .zulu { color: #ffe65a; font-size: 1.12em; }
    #l3-timesync .tier { color: #00ffc8; }
    #l3-timesync .mute { color: #7a8a9a; font-weight: 500; }
    #l3-timesync .mkt { color: #00ffa0; }
    #l3-transcript {
      min-height: 1.35em;
      max-height: 3.9em;
      overflow: hidden;
      font: 500 13px system-ui, "IBM Plex Sans", sans-serif;
      color: #e8f0f8;
      line-height: 1.3;
      text-shadow: 0 1px 4px #000c;
    }
    body.tv #l3-transcript { font-size: 16px; max-height: 4.2em; }
    #l3-transcript .line {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .55;
    }
    #l3-transcript .line.live { opacity: 1; color: #fff; }
    #l3-transcript .line time {
      color: #a78bfa;
      font: 600 0.85em ui-monospace, monospace;
      margin-right: .4em;
      font-variant-numeric: tabular-nums;
    }
    #l3-transcript .line .spk {
      color: #50c8ff;
      font-weight: 700;
      margin-right: .35em;
      font-size: .9em;
    }
    #l3-transcript .empty { color: #5a6a7a; font: 500 12px ui-monospace, monospace; }
    #l3-actions {
      display: none;
      gap: 4px;
      flex-wrap: wrap;
      grid-column: 1 / -1;
      pointer-events: auto;
    }
    body.control #l3-actions { display: flex; }
    #l3-actions button {
      background: #142030; color: var(--ink); border: 1px solid #2a4058;
      border-radius: 4px; padding: .2rem .45rem; font: 600 10px system-ui; cursor: pointer;
    }
    #l3-actions button.primary { background: #163848; border-color: #2a6a96; }
    #l3-actions input {
      flex: 1; min-width: 8rem; max-width: 22rem;
      background: #0c141e; color: var(--ink); border: 1px solid #2a4058;
      border-radius: 4px; padding: .2rem .45rem; font: 500 11px system-ui;
    }
    #pose-reticle {
      position: absolute; z-index: 17; width: 28px; height: 28px;
      margin: -14px 0 0 -14px; pointer-events: none;
      border: 2px solid #50c8ff; border-radius: 50%;
      box-shadow: 0 0 12px #50c8ff88, inset 0 0 8px #50c8ff44;
    }
    #pose-reticle::before, #pose-reticle::after {
      content: ""; position: absolute; background: #50c8ff;
    }
    #pose-reticle::before { left: 50%; top: 2px; bottom: 2px; width: 1px; margin-left: -0.5px; }
    #pose-reticle::after { top: 50%; left: 2px; right: 2px; height: 1px; margin-top: -0.5px; }
    #sync-badge {
      position: absolute; left: 12px; top: 12px; z-index: 18;
      font: 600 11px ui-monospace, monospace;
      padding: 3px 8px; border-radius: 4px;
      background: rgba(0,0,0,.55); color: #8ec8ff;
    }
    body.tv #sync-badge { top: 16px; font-size: 13px; }
    #sync-badge.ok { color: #4dff9a; border: 1px solid #4dff9a55; }
    #sync-badge.bad { color: #ff6b6b; border: 1px solid #ff6b6b55; }
  </style>
  <script src="/qrcode-generator.js"></script>
  <script src="/device-kit.js"></script>
</head>
<body>
  <div id="bar">
    <strong>BOX · track · cal</strong>
    <button type="button" id="btnGyro" class="primary">Phone gyro</button>
    <button type="button" id="btnZero" class="primary">Zero vantage</button>
    <button type="button" id="btnUser" data-action="user-cycle" class="primary">You</button>
    <button type="button" id="btnFloor">Floor</button>
    <button type="button" id="btnCrouch">Crouch</button>
    <button type="button" id="btnSeat">Seat</button>
    <button type="button" id="btnChair">Chair</button>
    <button type="button" id="btnStand">Stand</button>
    <button type="button" id="btnPlayPosture">Play</button>
    <button type="button" id="btnCams" data-action="cams-toggle">Cams</button>
    <button type="button" id="btnPhoneCam" data-action="phone-cam">Phone cam</button>
    <button type="button" id="btnRefreshTv" data-action="tv-refresh" class="primary">Refresh TV</button>
    <button type="button" id="btnRecastTv" data-action="tv-recast" class="primary">Recast TV</button>
    <button type="button" id="btnPlay" data-action="play-center">Play video</button>
    <button type="button" id="btnGlyph" data-action="glyph-qr" class="primary">Glyph QR</button>
    <button type="button" id="btnColor" data-action="color-test">Color test</button>
    <button type="button" id="btnVar0" class="active" data-v="default">default</button>
    <button type="button" id="btnVar1" data-v="op">op-art</button>
    <button type="button" id="btnVar2" data-v="neon">neon</button>
    <button type="button" id="btnVar3" data-v="forest">forest</button>
    <button type="button" id="btnGrid">grid</button>
    <button type="button" id="btnCube">cube</button>
    <span class="meta" id="meta">…</span>
  </div>
  <div id="err"></div>
  <div id="preview"><video id="prevVid" muted playsinline></video></div>
  <div id="world">
    <div id="sync-badge">seq —</div>
    <div id="pose-reticle"></div>
    <div id="forest"></div>
    <div id="canopy"></div>
    <div id="tunnel">
      <div id="tunnel-scroll"></div>
      <div id="tunnel-mirror"></div>
    </div>
    <div id="portal">
      <div class="chrome" id="vlabel">ZANE · center loop · mute</div>
      <video id="vid" playsinline webkit-playsinline muted loop autoplay></video>
    </div>
    <div id="cam-layer"></div>
    <div id="color-plate"></div>
    <div id="cube-wrap">
      <div class="cube" id="cube">
        <div class="face wire f"></div>
        <div class="face wire b"></div>
        <div class="face wire l"></div>
        <div class="face wire r"></div>
        <div class="face wire u"></div>
        <div class="face wire d"></div>
      </div>
    </div>
    <div id="horizon"><span class="label">horizon · eye line</span></div>
    <div id="glyph-qr" data-action="glyph-panel" aria-label="Scan for GrokCast phone PWA">
      <div id="glyph-qr-img"></div>
      <div class="g-title">GrokCast · HTTPS</div>
      <div class="g-url" id="glyph-qr-url">…</div>
      <div class="g-mode" id="glyph-qr-mode">scan → Add to Home Screen</div>
    </div>
    <canvas id="grid-canvas"></canvas>
    <div id="glass"></div>
    <div id="hud">BOX surface · waiting</div>
    <!-- L4 lower thirds: timesync + live transcript (blank / train / overview scaffold) -->
    <div id="l3" aria-label="Lower thirds broadcast info">
      <div id="l3-inner">
        <div id="l3-bug">
          <div class="show" id="l3-show">GrokCast</div>
          <div class="slug" id="l3-slug">BOX · live</div>
        </div>
        <div id="l3-main">
          <div id="l3-timesync">TIMESYNC · loading…</div>
          <div id="l3-transcript"><span class="empty">transcript · waiting (POST /api/transcript)</span></div>
        </div>
        <div id="l3-actions">
          <input id="l3-inject" type="text" placeholder="Inject caption…" maxlength="400" autocomplete="off" />
          <button type="button" id="btnL3Inject" class="primary">Send</button>
          <button type="button" id="btnL3Demo">Demo</button>
          <button type="button" id="btnL3Clear">Clear</button>
        </div>
      </div>
    </div>
  </div>
<script>
(function () {
  'use strict';
  const u = new URL(location.href);
  const isTv = u.searchParams.get('tv') === '1' || u.searchParams.get('cast') === '1';
  if (isTv) document.body.classList.add('tv');

  const MEDIA = u.searchParams.get('src') || '/media/zane-center.mp4';
  const COLS = +(u.searchParams.get('cols') || 8);
  const ROWS = +(u.searchParams.get('rows') || 4);
  const CENTER_CELLS = [12, 13, 20, 21]; // 2x2 around center of 8x4
  // default placement: you-cam top-left, continuity top-right, phone bottom-left
  const DEFAULT_CAM_MAP = { '1': 'cam0', '8': 'cam1', '25': 'phone' };

  const viewer = { yaw: 0, pitch: 0, roll: 0, z: 1, source: 'init', t: 0, seq: 0, lat: null, lon: null };
  let hubUpdated = 0; // long-poll / fast-poll cursor (hub.updated)
  let lastPoseSeq = 0; // apply only when hub pose_seq advances
  let showGrid = true, showCube = true, variation = 'default';
  let baseBeta = null, baseGamma = null, lastPush = 0;
  let lastRemotePoseAt = 0;
  let lastClockSnap = null;

  function gridGeom() {
    const w = window.innerWidth, h = window.innerHeight;
    const gutter = Math.max(20, Math.min(w, h) / 48);
    const gw = w - 2 * gutter, gh = h - 2 * gutter;
    return { w, h, gutter, cw: gw / COLS, ch: gh / ROWS };
  }

  function cellRect(n) {
    const { gutter, cw, ch } = gridGeom();
    const r = Math.floor((n - 1) / COLS);
    const c = (n - 1) % COLS;
    return { x: gutter + c * cw, y: gutter + r * ch, w: cw, h: ch };
  }

  // --- grid (full wall numbers + highlight center 2×2) ---
  function drawGrid() {
    const { w, h, gutter, cw, ch } = gridGeom();
    canvas.width = w;
    canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    if (!showGrid) return;

    // safe area
    const sx = w * 0.05, sy = h * 0.05;
    ctx.strokeStyle = 'rgba(40,200,120,.55)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sx, sy, w - 2 * sx, h - 2 * sy);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const n = r * COLS + c + 1;
        const x = gutter + c * cw;
        const y = gutter + r * ch;
        const hot = CENTER_CELLS.includes(n);
        const hasCam = !!camMap[String(n)];
        ctx.strokeStyle = hot ? 'rgba(255,220,80,.75)' : hasCam ? 'rgba(80,220,180,.55)' : 'rgba(120,200,255,.22)';
        ctx.lineWidth = hot || hasCam ? 2 : 1;
        ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
        if (hot) {
          ctx.fillStyle = 'rgba(255,220,80,.08)';
          ctx.fillRect(x, y, cw, ch);
        }
        ctx.fillStyle = hot ? 'rgba(255,240,180,.55)' : 'rgba(180,210,240,.35)';
        const fs = Math.max(14, Math.min(cw, ch) * 0.22);
        ctx.font = '600 ' + fs + 'px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = hot || hasCam ? 0.22 : 0.55;
        ctx.fillText(String(n), x + cw / 2, y + ch / 2);
        ctx.globalAlpha = 1;
      }
    }
    ctx.fillStyle = 'rgba(200,230,255,.7)';
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left';
    const camN = Object.keys(camMap).length;
    ctx.fillText(
      'CAST BOX · grid ' + COLS + '×' + ROWS + ' · center loop · depth cube · cams ' + camN,
      gutter + 4, gutter - 6
    );
    layoutCams();
  }

  function slugUrl(slug) {
    if (!slug) return null;
    if (String(slug).startsWith('http') || String(slug).startsWith('/')) return slug;
    const hit = camCatalog.find((c) => c.slug === slug);
    if (hit && hit.url) return hit.url;
    return '/media/cams/' + slug + '.jpg';
  }

  function layoutCams() {
    if (!camsEnabled) {
      camLayer.innerHTML = '';
      return;
    }
    const entries = Object.entries(camMap);
    // reuse existing tiles when possible
    const want = new Set(entries.map(([cell, slug]) => cell + ':' + slug));
    [...camLayer.children].forEach((el) => {
      if (!want.has(el.dataset.key)) el.remove();
    });
    entries.forEach(([cell, slug]) => {
      const n = +cell;
      if (!n || CENTER_CELLS.includes(n)) return; // don't cover center portal cells
      const key = cell + ':' + slug;
      let el = camLayer.querySelector('[data-key="' + key + '"]');
      const rect = cellRect(n);
      const pad = 4;
      if (!el) {
        el = document.createElement('div');
        el.className = 'cam-tile' + (slug === 'phone' ? ' phone' : '');
        el.dataset.key = key;
        el.dataset.cell = cell;
        el.dataset.slug = slug;
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = cell + ' · ' + slug;
        const img = document.createElement('img');
        img.alt = slug;
        img.decoding = 'async';
        el.appendChild(img);
        el.appendChild(tag);
        camLayer.appendChild(el);
      }
      el.style.left = (rect.x + pad) + 'px';
      el.style.top = (rect.y + pad) + 'px';
      el.style.width = Math.max(40, rect.w - pad * 2) + 'px';
      el.style.height = Math.max(40, rect.h - pad * 2) + 'px';
      const img = el.querySelector('img');
      const url = slugUrl(slug);
      if (url && img) {
        // cache-bust for live stills
        const bust = url + (url.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 200);
        if (img.dataset.base !== url) {
          img.dataset.base = url;
          img.src = bust;
        } else if (!img.complete || img.naturalWidth === 0) {
          img.src = bust;
        } else {
          // refresh periodically without flicker when possible
          const tmp = new Image();
          tmp.onload = () => { img.src = tmp.src; };
          tmp.src = bust;
        }
      }
    });
  }

  async function refreshCams() {
    try {
      const r = await fetch('/api/cams', { cache: 'no-store' });
      if (!r.ok) return;
      const data = await r.json();
      camCatalog = data.cams || [];
      if (data.cam_map && Object.keys(data.cam_map).length) {
        camMap = Object.assign({}, DEFAULT_CAM_MAP, data.cam_map);
      } else if (camCatalog.length) {
        // auto-map first two mac cams if map empty
        const m = Object.assign({}, camMap);
        if (camCatalog[0] && !Object.values(m).includes(camCatalog[0].slug)) m['1'] = camCatalog[0].slug;
        if (camCatalog[1] && !Object.values(m).includes(camCatalog[1].slug)) m['8'] = camCatalog[1].slug;
        camMap = m;
      }
      layoutCams();
    } catch (_) {}
  }

  function isSecureMediaContext() {
    // iOS Safari: mediaDevices only on https: or localhost
    if (typeof window.isSecureContext === 'boolean' && window.isSecureContext) return true;
    const h = location.hostname;
    return h === 'localhost' || h === '127.0.0.1' || location.protocol === 'https:';
  }

  async function startPhoneCam() {
    if (isTv) return;
    const md = navigator.mediaDevices;
    if (!md || typeof md.getUserMedia !== 'function') {
      const why = !isSecureMediaContext()
        ? 'Safari blocks getUserMedia on plain HTTP LAN (http://192.168.x.x). Need HTTPS, or use Continuity Brick (cam1) via Mac cam-relay.'
        : 'navigator.mediaDevices missing in this browser.';
      showErr('phone cam: ' + why + ' · Use cell 8 Brick cam, or enable HTTPS later.');
      // still ensure Continuity path is mapped
      camMap['8'] = camMap['8'] || 'cam1';
      camMap['1'] = camMap['1'] || 'cam0';
      pushCamMap();
      return;
    }
    try {
      phoneStream = await md.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 360 } },
        audio: false,
      });
      const pv = document.getElementById('prevVid');
      const box = document.getElementById('preview');
      if (pv && box) {
        pv.srcObject = phoneStream;
        box.style.display = 'block';
        pv.play().catch(() => {});
      }
      // push JPEG frames to hub for TV
      const cap = document.createElement('canvas');
      cap.width = 640; cap.height = 360;
      const cctx = cap.getContext('2d');
      if (phonePushTimer) clearInterval(phonePushTimer);
      phonePushTimer = setInterval(async () => {
        if (!phoneStream) return;
        try {
          cctx.save();
          cctx.translate(cap.width, 0);
          cctx.scale(-1, 1);
          cctx.drawImage(pv, 0, 0, cap.width, cap.height);
          cctx.restore();
          const blob = await new Promise((res) => cap.toBlob(res, 'image/jpeg', 0.7));
          if (!blob) return;
          await fetch('/api/cam/frame', { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
        } catch (_) {}
      }, 180);
      camMap['25'] = 'phone';
      pushCamMap();
      document.getElementById('btnPhoneCam').textContent = 'Phone cam on';
      err.style.display = 'none';
    } catch (e) {
      showErr('phone cam: ' + (e && e.message ? e.message : e));
    }
  }

  function qrPayload() {
    // Prefer HTTPS PWA control URL (secure context for phone streaming app)
    if (glyphAddrs) {
      return glyphAddrs.scan || glyphAddrs.ctrl || glyphAddrs.hub_https + '/box?pwa=1' ||
        glyphAddrs.direct || (location.origin + '/box?pwa=1');
    }
    // if already on https, use self; if http (TV), still show https port default
    if (location.protocol === 'https:') return location.origin + '/box?pwa=1';
    return 'https://' + location.hostname + ':8792/box?pwa=1';
  }

  function renderGlyphQr() {
    const host = document.getElementById('glyph-qr-img');
    const urlEl = document.getElementById('glyph-qr-url');
    const modeEl = document.getElementById('glyph-qr-mode');
    const panel = document.getElementById('glyph-qr');
    if (!host || !panel) return;
    panel.style.display = showGlyph ? 'block' : 'none';
    if (!showGlyph) return;
    const text = qrPayload();
    if (urlEl) urlEl.textContent = text;
    if (modeEl) {
      const secure = glyphAddrs && glyphAddrs.secure;
      modeEl.textContent = secure
        ? 'HTTPS PWA · secure streaming context'
        : 'scan → phone · prefer https://…:8792';
    }
    if (typeof qrcode !== 'function') {
      host.innerHTML = '<p style="padding:8px;font:11px system-ui;color:#900">qr lib missing</p>';
      return;
    }
    try {
      const q = qrcode(0, 'M');
      q.addData(text);
      q.make();
      // larger module on TV for phone scan distance
      const cell = isTv ? 6 : 4;
      const margin = 2;
      host.innerHTML = q.createImgTag(cell, margin);
      const img = host.querySelector('img');
      if (img) {
        img.alt = 'QR open phone control: ' + text;
        img.style.width = '100%';
        img.style.height = 'auto';
      }
    } catch (e) {
      host.innerHTML = '<p style="padding:8px;color:#900">' + String(e) + '</p>';
    }
  }

  function activeUserPreset() {
    return USER_PRESETS[vantage.user] || USER_PRESETS.you;
  }

  function horizonFromHeights(eyeCm, centerCm) {
    const panelH = vantage.panel_height_cm || 81; // ~32" tall class panel
    const top = (centerCm || HOUSE.center_mark_cm) + panelH / 2;
    return Math.max(0.12, Math.min(0.88, (top - eyeCm) / panelH));
  }

  function eyeCmForPosture(posture) {
    const u = activeUserPreset();
    const map = {
      floor: u.floor_eye_cm ?? 25,
      crouch: u.crouch_eye_cm ?? 90,
      seat: u.eye_height_cm ?? 157.5,
      chair: u.chair_eye_cm ?? 145,
      stand: u.stand_eye_cm ?? 170,
      play: ((u.floor_eye_cm || 25) + (u.stand_eye_cm || 140)) / 2,
      pet: u.eye_height_cm ?? 40,
    };
    return map[posture] != null ? map[posture] : (u.eye_height_cm || 157.5);
  }

  /** Effective view: measured house heights + user profile + smooth */
  function effectiveView() {
    const g = vantage.gain || 1.4;
    const sm = Math.max(0, Math.min(0.9, vantage.smooth || 0));
    const center = vantage.tv_center_height_cm || HOUSE.center_mark_cm;
    const eye = vantage.height_track_cm || vantage.eye_height_cm || HOUSE.horizon_seat_cm;
    // +eye above center → slight look-down to hit mark (62" vs 60.5")
    const dh = (eye - center) / 120;
    const modeBias = {
      floor: 0.22, crouch: 0.1, seat: -0.02, chair: 0.0,
      stand: -0.1, play: 0.08, pet: 0.28,
    }[vantage.posture || vantage.mode] || 0;

    let rawYaw = (viewer.yaw - (vantage.yaw0 || 0)) * g;
    let rawPitch = (viewer.pitch - (vantage.pitch0 || 0)) * g + modeBias + dh * 0.18;
    let rawRoll = (viewer.roll || 0) * 0.5;

    smoothYaw = smoothYaw * sm + rawYaw * (1 - sm);
    smoothPitch = smoothPitch * sm + rawPitch * (1 - sm);
    smoothRoll = smoothRoll * sm + rawRoll * (1 - sm);

    const dist = vantage.seat_distance_cm || 274;
    const zBase = Math.max(0.7, Math.min(1.5, 280 / dist));
    const z = Math.max(0.65, Math.min(1.65, (viewer.z || 1) * zBase));
    return {
      yaw: Math.max(-1.8, Math.min(1.8, smoothYaw)),
      pitch: Math.max(-1.5, Math.min(1.5, smoothPitch)),
      roll: smoothRoll,
      z,
    };
  }

  function updateHorizon() {
    const el = document.getElementById('horizon');
    if (!el) return;
    const eye = vantage.height_track_cm || vantage.eye_height_cm || HOUSE.horizon_seat_cm;
    const center = vantage.tv_center_height_cm || HOUSE.center_mark_cm;
    let n = horizonFromHeights(eye, center);
    vantage.horizon_norm = n;
    const ev = effectiveView();
    n = Math.max(0.12, Math.min(0.88, n + ev.pitch * 0.035));
    el.style.top = (n * 100) + '%';
    const lab = el.querySelector('.label');
    if (lab) {
      lab.textContent =
        'horizon · ' + (vantage.user || '?') + '/' + (vantage.posture || vantage.mode) +
        ' · eye ' + (eye / 2.54).toFixed(0) + '" · center ' + (center / 2.54).toFixed(1) +
        '" · ' + (vantage.motion || 'still') +
        (vantage.stability === 'calm' ? ' · calm' : '') +
        (vantage.stability === 'play' ? ' · play' : '') +
        (vantage.stability === 'pet' ? ' · pet' : '');
    }
  }

  function applyUser(userId) {
    const u = USER_PRESETS[userId] || USER_PRESETS.you;
    vantage.user = userId;
    vantage.gain = u.gain;
    vantage.smooth = u.smooth;
    vantage.stability = u.stability;
    vantage.seat_distance_cm = u.seat_distance_cm;
    const posture = (vantage.posture && vantage.posture !== 'pet' && userId !== 'dog')
      ? (userId === 'kid' && vantage.posture === 'seat' ? 'play' : vantage.posture)
      : (u.mode || 'seat');
    applyPosture(userId === 'dog' ? 'pet' : posture, false);
    const btn = document.getElementById('btnUser');
    if (btn) { btn.textContent = u.label; btn.classList.add('active'); }
    document.body.classList.toggle('user-calm', u.stability === 'calm');
    document.body.classList.toggle('user-play', u.stability === 'play');
    document.body.classList.toggle('user-pet', u.stability === 'pet');
    applyPose();
    pushViewer();
  }

  function applyPosture(posture, push) {
    const p = posture || 'seat';
    vantage.posture = p;
    vantage.mode = p;
    const eye = eyeCmForPosture(p);
    vantage.eye_height_cm = eye;
    vantage.height_track_cm = eye;
    vantage.tv_center_height_cm = HOUSE.center_mark_cm;
    vantage.tv_height_cm = HOUSE.center_mark_cm;
    vantage.eye_above_center_cm = eye - HOUSE.center_mark_cm;
    vantage.horizon_norm = horizonFromHeights(eye, HOUSE.center_mark_cm);
    const keys = { floor: 'Floor', crouch: 'Crouch', seat: 'Seat', chair: 'Chair', stand: 'Stand', play: 'PlayPosture', pet: 'PlayPosture' };
    Object.keys(keys).forEach((k) => {
      const b = document.getElementById('btn' + keys[k]);
      if (b) b.classList.toggle('active', k === p || (p === 'pet' && k === 'play'));
    });
    updateHorizon();
    applyPose();
    if (push !== false) pushViewer();
  }

  function cycleUser() {
    const i = USER_ORDER.indexOf(vantage.user);
    applyUser(USER_ORDER[(i + 1) % USER_ORDER.length]);
  }

  function onDeviceMotion(e) {
    if (isTv) return;
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (!a) return;
    const mag = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
    const jerk = Math.abs(mag - lastAccel);
    lastAccel = mag;
    if (jerk > 4) vantage.motion = 'play';
    else if (jerk > 1.2) vantage.motion = 'roam';
    else if (jerk > 0.35) vantage.motion = 'shift';
    else vantage.motion = 'still';
    const baseGain = activeUserPreset().gain || 1.4;
    if (vantage.user === 'kid' && (vantage.motion === 'play' || vantage.motion === 'roam')) {
      vantage.gain = Math.min(2.0, baseGain + 0.25);
    } else if (vantage.stability === 'calm') {
      vantage.gain = baseGain;
      vantage.smooth = Math.max(vantage.smooth, 0.5);
    } else {
      vantage.gain = baseGain;
    }
  }

  function estimateHeightFromOrientation(beta) {
    if (beta == null || vantage.stability === 'calm') return;
    const b = Math.abs(beta);
    let suggestion = 'seat';
    if (b < 25) suggestion = 'floor';
    else if (b < 45) suggestion = 'crouch';
    else if (b < 70) suggestion = 'seat';
    else suggestion = 'stand';
    const target = eyeCmForPosture(suggestion);
    const cur = vantage.height_track_cm || target;
    vantage.height_track_cm = cur * 0.85 + target * 0.15;
  }

  function paintColorPlate() {
    const plate = document.getElementById('color-plate');
    if (!plate) return;
    if (!colorOn) {
      document.body.classList.remove('color-on');
      return;
    }
    document.body.classList.add('color-on');
    // complementary / tertiary / primaries / grayscale / painting — e-ink style patches
    const sets = {
      complementary: [
        ['#e53935', 'R'], ['#1e88e5', 'B comp'], ['#43a047', 'G'], ['#ab47bc', 'M'],
        ['#fdd835', 'Y'], ['#5e35b1', 'V'], ['#00acc1', 'C'], ['#f4511e', 'O'],
      ],
      tertiary: [
        ['#ff6f00', 'RY'], ['#c0ca33', 'YG'], ['#00bfa5', 'GC'],
        ['#2979ff', 'CB'], ['#7c4dff', 'BV'], ['#f50057', 'VR'],
        ['#ffd600', 'Y'], ['#651fff', 'V'],
      ],
      primaries: [
        ['#ff0000', 'R'], ['#00ff00', 'G'], ['#0000ff', 'B'],
        ['#ffff00', 'Y'], ['#00ffff', 'C'], ['#ff00ff', 'M'],
        ['#ffffff', 'W'], ['#000000', 'K'],
      ],
      grayscale: [
        ['#000000', '0'], ['#242424', '14'], ['#484848', '28'], ['#6c6c6c', '42'],
        ['#909090', '56'], ['#b4b4b4', '70'], ['#d8d8d8', '85'], ['#ffffff', '100'],
      ],
      painting: [
        ['#2c1810', 'umbra'], ['#8b3a2a', 'sienna'], ['#c4a35a', 'ochre'],
        ['#1a3a2a', 'terre'], ['#3d5a80', 'ultramarine'], ['#e8dcc8', 'gesso'],
        ['#7a1f1f', 'cad red'], ['#f4f0e6', 'lead white'],
      ],
    };
    const cells = sets[colorMode] || sets.complementary;
    plate.style.gridTemplateColumns = 'repeat(4, 1fr)';
    plate.style.gridTemplateRows = 'repeat(2, 1fr)';
    plate.innerHTML = cells.map(([hex, name]) =>
      '<div class="swatch" style="background:' + hex + '">' + name + '<br>' + hex + '</div>'
    ).join('');
  }

  // --- parallax layout (calibrated) — forced perspective from phone gyro + seat distance ---
  function applyPose() {
    const ev = effectiveView();
    // stronger multi-plane shift so TV reads living room depth from phone
    const k = 72;
    const y = ev.yaw * k;
    const p = ev.pitch * k;
    const z = ev.z;
    // geo subtle world-turn (lat/lon vs TV anchor)
    let geoYaw = 0;
    if (viewer.lat != null && viewer.lon != null && vantage.tv_lat != null && vantage.tv_lon != null) {
      const dLon = (viewer.lon - vantage.tv_lon) * Math.PI / 180;
      const gy = Math.sin(dLon) * Math.cos(viewer.lat * Math.PI / 180);
      const gx = Math.cos(vantage.tv_lat * Math.PI / 180) * Math.sin(viewer.lat * Math.PI / 180) -
        Math.sin(vantage.tv_lat * Math.PI / 180) * Math.cos(viewer.lat * Math.PI / 180) * Math.cos(dLon);
      geoYaw = Math.atan2(gy, gx) * 18; // px bias
    }
    const yx = y + geoYaw;

    document.getElementById('forest').style.transform =
      'translate3d(' + (-yx * 0.35) + 'px,' + (-p * 0.28) + 'px,0) scale(' + (1.1 + (z - 1) * 0.04) + ')';
    document.getElementById('canopy').style.transform =
      'translate3d(' + (-yx * 0.7) + 'px,' + (-p * 0.55) + 'px,0) scale(1.06)';
    document.getElementById('tunnel').style.transform =
      'translate(-50%,-50%) translate3d(' + (-yx * 1.05) + 'px,' + (-p * 0.85) + 'px,0) scale(' + (1 + (z - 1) * 0.12) + ') ' +
      'rotateY(' + (ev.yaw * -6) + 'deg) rotateX(' + (ev.pitch * 5) + 'deg)';
    document.getElementById('portal').style.transform =
      'translate(-50%,-50%) translate3d(' + (-yx * 1.35) + 'px,' + (-p * 1.1) + 'px,0) scale(' + (1 + (z - 1) * 0.1) + ') ' +
      'rotateY(' + (ev.yaw * -8) + 'deg) rotateX(' + (ev.pitch * 6) + 'deg)';
    if (camLayer) {
      camLayer.style.transform =
        'translate3d(' + (-yx * 1.15) + 'px,' + (-p * 0.95) + 'px,0)';
    }
    document.getElementById('glass').style.transform =
      'translate3d(' + (-yx * 1.55) + 'px,' + (-p * 1.3) + 'px,0)';

    // Perspective cube: base orientation from vantage, then viewer delta
    // Starting geometry locked by Zero vantage; then parallax rotates from that
    const baseRx = vantage.mode === 'stand' ? 12 : 22;
    const rx = baseRx + ev.pitch * 48;
    const ry = -ev.yaw * 52;
    const rz = ev.roll * 18;
    document.getElementById('cube-wrap').style.transform =
      'translate(calc(-50% + ' + (-yx * 0.45) + 'px), calc(-50% + ' + (-p * 0.4) + 'px))';
    document.getElementById('cube').style.transform =
      'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) rotateZ(' + rz + 'deg) scale(' + (0.88 + z * 0.22) + ')';
    document.getElementById('cube-wrap').style.opacity = showCube ? '1' : '0';

    updateHorizon();

    // reticle: pure screen-space match phone ↔ TV (center + yaw/pitch)
    const ret = document.getElementById('pose-reticle');
    if (ret) {
      const cx = window.innerWidth / 2 + y * 2.2;
      const cy = window.innerHeight / 2 + p * 2.2;
      ret.style.left = cx + 'px';
      ret.style.top = cy + 'px';
    }

    const age = lastRemotePoseAt ? ((Date.now() - lastRemotePoseAt) / 1000).toFixed(1) : '—';
    const matched = isTv
      ? (lastRemotePoseAt && Date.now() - lastRemotePoseAt < 600)
      : true;
    const syncCls = matched ? 'sync-ok' : 'sync-bad';
    const seq = viewer.seq || lastPoseSeq || 0;
    const line = 'yaw ' + ev.yaw.toFixed(2) + '  pitch ' + ev.pitch.toFixed(2) +
      '  · ' + (viewer.source || '?') + '  · ' + vantage.mode + '  · g' + (vantage.gain || 1).toFixed(2) +
      '  · seq ' + seq;
    meta.innerHTML = '<span class="' + syncCls + '">' + line + '</span>';
    hud.textContent = (isTv ? 'TV · ' : 'CTRL · ') + line +
      (isTv ? ' · rx ' + age + 's' : ' · drag/gyro → TV') +
      ' · loop ' + (vid.readyState >= 2 ? 'OK' : '…');
    const badge = document.getElementById('sync-badge');
    if (badge) {
      badge.className = matched ? 'ok' : 'bad';
      badge.textContent = (isTv ? 'RX' : 'TX') + ' seq ' + seq +
        (isTv ? (' · ' + age + 's') : ' · push');
    }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderClock(snap) {
    // L3 lower-thirds timesync (moved from top strip)
    const el = document.getElementById('l3-timesync');
    if (!el || !snap) return;
    lastClockSnap = snap;
    const zulu = snap.zulu || '';
    const zuluPretty = zulu.length >= 7
      ? zulu.slice(0, 2) + ':' + zulu.slice(2, 4) + ':' + zulu.slice(4, 6) + ' Z'
      : zulu;
    // full --json: tier.label · pipe: tier int + tier_label
    let tier = 'L?';
    if (snap.tier && typeof snap.tier === 'object') tier = snap.tier.label || ('L' + snap.tier.level);
    else if (snap.tier_label) tier = snap.tier_label;
    else if (snap.tier != null) tier = 'L' + snap.tier + (snap.tier_label ? ' ' + snap.tier_label : '');
    const unix = snap.unix_frac || snap.unix || '';
    const drift = snap.epoch_drift_ms != null ? ('Δ' + Number(snap.epoch_drift_ms).toFixed(2) + 'ms') : '';
    let ntp = 'ntp —';
    if (snap.ntp && (snap.ntp.ok || snap.ntp.offset_ms != null)) {
      ntp = 'ntp +' + Number(snap.ntp.offset_ms || 0).toFixed(1) + 'ms s' + (snap.ntp.stratum || '?');
    } else if (snap.ntp_offset_ms != null) {
      ntp = 'ntp +' + Number(snap.ntp_offset_ms).toFixed(1) + 'ms s' + (snap.ntp_stratum || '?');
    }
    let mkts = '';
    if (Array.isArray(snap.markets)) {
      mkts = snap.markets.filter((m) => m.status === 'open').slice(0, 4).map((m) => m.label || m.id).join(' ');
    } else if (Array.isArray(snap.markets_open)) {
      mkts = snap.markets_open.slice(0, 4).join(' ').toUpperCase();
    }
    el.innerHTML =
      '<span class="mute">TIMESYNC</span> · ' +
      '<span class="zulu">' + zuluPretty + '</span> · ' +
      '<span class="tier">' + tier + '</span> · ' +
      '<span class="mute">unix ' + unix + '</span> · ' +
      '<span class="mute">' + drift + '</span> · ' +
      '<span class="mute">' + ntp + '</span>' +
      (mkts ? ' · <span class="mkt">● ' + mkts + '</span>' : '') +
      ' · <span class="mute">fc-timesync-v1 · L3</span>';
  }

  async function pullClock() {
    try {
      const r = await fetch('/api/clock?_=' + Date.now(), { cache: 'no-store' });
      if (r.ok) renderClock(await r.json());
    } catch (_) {}
  }

  // Live transcript — blank captions shape · train themes · overview columns (scaffold)
  let lastTranscriptSeq = 0;
  let transcriptLines = [];

  function renderTranscript(payload) {
    const el = document.getElementById('l3-transcript');
    if (!el) return;
    if (payload && Array.isArray(payload.lines)) {
      if (payload.seq != null && payload.seq < lastTranscriptSeq && payload.lines.length === 0) {
        // clear or reset
        transcriptLines = [];
        lastTranscriptSeq = payload.seq;
      } else {
        const incoming = payload.lines;
        if (payload.meta && payload.meta.program) {
          const slug = document.getElementById('l3-slug');
          if (slug && payload.meta.program !== 'l3-demo') {
            slug.textContent = String(payload.meta.program).slice(0, 28);
          }
        }
        // merge by seq
        const bySeq = new Map(transcriptLines.map((ln) => [ln.seq, ln]));
        for (const ln of incoming) {
          if (ln && ln.seq != null) bySeq.set(ln.seq, ln);
        }
        transcriptLines = Array.from(bySeq.values()).sort((a, b) => (a.seq || 0) - (b.seq || 0)).slice(-24);
        if (payload.seq != null) lastTranscriptSeq = Math.max(lastTranscriptSeq, payload.seq);
      }
    }
    const show = transcriptLines.slice(-3);
    if (!show.length) {
      el.innerHTML = '<span class="empty">transcript · idle · blank/train/overview bus</span>';
      return;
    }
    el.innerHTML = show.map((ln, i) => {
      const live = i === show.length - 1 ? ' live' : '';
      const spk = ln.speaker ? '<span class="spk">' + escapeHtml(ln.speaker) + '</span>' : '';
      const tm = ln.time ? '<time>' + escapeHtml(ln.time) + '</time>' : '';
      return '<span class="line' + live + '">' + tm + spk + escapeHtml(ln.text || '') + '</span>';
    }).join('');
  }

  async function pullTranscript() {
    try {
      const q = lastTranscriptSeq
        ? '/api/transcript?limit=24&since=' + lastTranscriptSeq + '&_=' + Date.now()
        : '/api/transcript?limit=8&_=' + Date.now();
      const r = await fetch(q, { cache: 'no-store' });
      if (!r.ok) return;
      const data = await r.json();
      if (data.lines && data.lines.length) renderTranscript(data);
      else if (!lastTranscriptSeq && data.seq === 0) renderTranscript(data);
      else if (data.seq != null) lastTranscriptSeq = Math.max(lastTranscriptSeq, data.seq);
    } catch (_) {}
  }

  async function injectTranscript(text, extra) {
    const body = Object.assign({
      text: text,
      speaker: 'CTRL',
      source: 'inject',
      program: 'box',
      project: 'grok-cli',
    }, extra || {});
    const r = await fetch('/api/transcript', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (r.ok) {
      const data = await r.json();
      renderTranscript({ seq: data.seq, lines: data.lines || [], meta: data.meta });
    }
    return r.ok;
  }

  function wireL3Controls() {
    if (isTv) return;
    const inp = document.getElementById('l3-inject');
    const send = document.getElementById('btnL3Inject');
    const demo = document.getElementById('btnL3Demo');
    const clear = document.getElementById('btnL3Clear');
    if (send && inp) {
      const go = async () => {
        const t = (inp.value || '').trim();
        if (!t) return;
        await injectTranscript(t);
        inp.value = '';
      };
      send.onclick = go;
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); go(); }
      });
    }
    if (demo) {
      demo.onclick = async () => {
        try {
          const r = await fetch('/api/transcript/demo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ program: 'box', project: 'blank' }),
          });
          if (r.ok) {
            const data = await r.json();
            lastTranscriptSeq = 0;
            transcriptLines = [];
            renderTranscript({ seq: data.seq, lines: data.lines || [] });
          }
        } catch (_) {}
      };
    }
    if (clear) {
      clear.onclick = async () => {
        try {
          await fetch('/api/transcript/clear', { method: 'POST' });
          transcriptLines = [];
          lastTranscriptSeq = 0;
          renderTranscript({ seq: 0, lines: [] });
        } catch (_) {}
      };
    }
  }

  async function pushViewer() {
    if (isTv) return;
    try {
      const r = await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          surface: 'box',
          variation: variation,
          viewer: {
            yaw: viewer.yaw,
            pitch: viewer.pitch,
            roll: viewer.roll,
            z: viewer.z,
            source: viewer.source,
            lat: viewer.lat,
            lon: viewer.lon,
            t: Date.now() / 1000,
          },
          vantage: vantage,
          color_test: { enabled: colorOn, mode: colorMode },
          controller: 'box-phone',
        }),
      });
      if (r.ok) {
        const st = await r.json();
        if (st.updated) hubUpdated = st.updated;
        if (st.pose_seq != null) {
          lastPoseSeq = st.pose_seq;
          viewer.seq = st.pose_seq;
        }
        lastPush = Date.now();
        applyPose(); // refresh TX badge
      }
    } catch (e) {
      const badge = document.getElementById('sync-badge');
      if (badge) { badge.className = 'bad'; badge.textContent = 'TX fail'; }
    }
  }

  function applyRemoteState(st, force) {
    if (!st) return;
    if (typeof st.updated === 'number') hubUpdated = st.updated;
    const seq = intOr(st.pose_seq, st.viewer && st.viewer.seq, 0);
    // skip stale poses (except force first paint)
    if (!force && seq && seq <= lastPoseSeq && isTv) {
      return;
    }
    if (seq) lastPoseSeq = seq;

    if (st.viewer && typeof st.viewer === 'object') {
      Object.assign(viewer, st.viewer);
      viewer.seq = seq || viewer.seq;
      if (isTv && st.viewer.source && st.viewer.source !== 'init' && st.viewer.source !== 'idle') {
        lastRemotePoseAt = Date.now();
      }
    }
    if (st.vantage && typeof st.vantage === 'object') {
      vantage = Object.assign({}, vantage, st.vantage);
    }
    if (st.variation) setVariation(st.variation, false);
    if (st.cam_map && typeof st.cam_map === 'object') {
      camMap = Object.assign({}, DEFAULT_CAM_MAP, st.cam_map);
      layoutCams();
    }
    if (st.color_test && typeof st.color_test === 'object') {
      colorOn = !!st.color_test.enabled;
      colorMode = st.color_test.mode || colorMode;
      paintColorPlate();
    }
    // TV soft-reload when phone taps Refresh TV
    if (isTv && st.tv_cmd && typeof st.tv_cmd.reload_token === 'number') {
      if (lastReloadToken && st.tv_cmd.reload_token > lastReloadToken) {
        location.reload();
        return;
      }
      lastReloadToken = st.tv_cmd.reload_token;
    }
    applyPose();
  }

  function intOr() {
    for (let i = 0; i < arguments.length; i++) {
      const v = arguments[i];
      if (v != null && v !== '' && !isNaN(+v)) return +v;
    }
    return 0;
  }

  function startSse() {
    if (!isTv || typeof EventSource === 'undefined') return false;
    try {
      const es = new EventSource('/api/viewer/stream');
      es.addEventListener('pose', (ev) => {
        try {
          const st = JSON.parse(ev.data);
          applyRemoteState(st);
        } catch (_) {}
      });
      es.onerror = () => {
        // fall back to poll; browser will retry EventSource
      };
      return true;
    } catch (_) {
      return false;
    }
  }

  async function pullLoop() {
    if (!isTv) return;
    // Fast pose-only poll (DashCast-safe) + optional SSE
    try {
      const r = await fetch('/api/viewer?_=' + Date.now() + '&seq=' + lastPoseSeq, { cache: 'no-store' });
      if (r.ok) {
        const st = await r.json();
        applyRemoteState(st);
      }
    } catch (_) {}
    setTimeout(pullLoop, 50);
  }

  function setViewerFromLocal(yaw, pitch, roll, source) {
    viewer.yaw = Math.max(-1.5, Math.min(1.5, yaw));
    viewer.pitch = Math.max(-1.5, Math.min(1.5, pitch));
    if (roll != null) viewer.roll = roll;
    viewer.source = source;
    viewer.t = Date.now() / 1000;
    applyPose();
    if (Date.now() - lastPush > 33) pushViewer();
  }

  function onOrient(e) {
    const beta = e.beta ?? 0, gamma = e.gamma ?? 0;
    if (baseBeta == null) { baseBeta = beta; baseGamma = gamma; }
    const pitch = (beta - baseBeta) / 22;
    const yaw = (gamma - baseGamma) / 22;
    estimateHeightFromOrientation(beta);
    setViewerFromLocal(yaw, pitch, (e.alpha || 0) / 180, 'deviceorientation');
  }

  function zeroVantage() {
    // lock current phone pose as "looking at TV center mark" (60.5")
    vantage.yaw0 = viewer.yaw;
    vantage.pitch0 = viewer.pitch;
    baseBeta = null;
    baseGamma = null;
    // re-assert measured house numbers
    vantage.tv_center_height_cm = HOUSE.center_mark_cm;
    vantage.tv_height_cm = HOUSE.center_mark_cm;
    if (!vantage.height_track_cm) {
      vantage.height_track_cm = eyeCmForPosture(vantage.posture || 'seat');
    }
    applyPose();
    pushViewer();
    hud.textContent =
      'ZERO · ' + (vantage.user || 'you') + '/' + (vantage.posture || 'seat') +
      ' · eye ' + ((vantage.height_track_cm || 0) / 2.54).toFixed(0) +
      '" · center 60.5" · now move';
  }

  // pointer / touch — always on for control (no button needed)
  let drag = false, lx = 0, ly = 0;
  window.addEventListener('pointerdown', (e) => {
    if (isTv) return;
    if (e.target.closest && e.target.closest('#bar, button, a, input')) return;
    drag = true;
    lx = e.clientX;
    ly = e.clientY;
    try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch (_) {}
  });
  window.addEventListener('pointerup', () => { drag = false; });
  window.addEventListener('pointercancel', () => { drag = false; });
  window.addEventListener('pointermove', (e) => {
    if (!drag || isTv) return;
    const dyaw = (e.clientX - lx) / 90;
    const dpitch = (e.clientY - ly) / 90;
    lx = e.clientX;
    ly = e.clientY;
    setViewerFromLocal(viewer.yaw + dyaw, viewer.pitch + dpitch, viewer.roll, 'pointer');
  });
  // also map device motion as continuous stream when gyro on

  function setVariation(v, push) {
    variation = v || 'default';
    document.body.classList.remove('var-op', 'var-neon', 'var-forest');
    if (variation === 'op') document.body.classList.add('var-op');
    if (variation === 'neon') document.body.classList.add('var-neon');
    if (variation === 'forest') document.body.classList.add('var-forest');
    document.querySelectorAll('#bar [data-v]').forEach((b) => {
      b.classList.toggle('active', b.getAttribute('data-v') === variation ||
        (variation === 'default' && b.getAttribute('data-v') === 'default'));
    });
    if (push !== false && !isTv) {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ variation: variation, surface: 'box' }),
      }).catch(() => {});
    }
  }

  async function enableGyro(fromUser) {
    if (isTv) return false;
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const p = await DeviceOrientationEvent.requestPermission();
        if (p !== 'granted') {
          if (fromUser) alert('gyro denied — use drag on screen');
          return false;
        }
      }
      baseBeta = baseGamma = null;
      window.addEventListener('deviceorientation', onOrient, true);
      window.addEventListener('devicemotion', onDeviceMotion, true);
      const bg = document.getElementById('btnGyro');
      if (bg) {
        bg.textContent = 'Gyro on';
        bg.classList.add('active');
      }
      return true;
    } catch (e) {
      if (fromUser) alert(e);
      return false;
    }
  }

  function enableGeo() {
    if (isTv || !navigator.geolocation) return;
    try {
      navigator.geolocation.watchPosition(
        (pos) => {
          viewer.lat = pos.coords.latitude;
          viewer.lon = pos.coords.longitude;
          // optional distance → seat_distance / z if TV geo known
          if (vantage.tv_lat != null && vantage.tv_lon != null && pos.coords.accuracy < 50) {
            const R = 6371000;
            const dLat = (viewer.lat - vantage.tv_lat) * Math.PI / 180;
            const dLon = (viewer.lon - vantage.tv_lon) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(vantage.tv_lat * Math.PI / 180) * Math.cos(viewer.lat * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
            const distM = 2 * R * Math.asin(Math.sqrt(a));
            if (distM > 0.5 && distM < 25) {
              vantage.seat_distance_cm = Math.round(distM * 100);
              viewer.z = Math.max(0.7, Math.min(1.5, 280 / vantage.seat_distance_cm));
            }
          }
          applyPose();
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 8000 }
      );
    } catch (_) {}
  }

  document.getElementById('btnGyro').onclick = async () => {
    await enableGyro(true);
    enableGeo();
  };
  document.getElementById('btnZero').onclick = () => zeroVantage();
  document.getElementById('btnUser').onclick = () => cycleUser();
  document.getElementById('btnFloor').onclick = () => applyPosture('floor');
  document.getElementById('btnCrouch').onclick = () => applyPosture('crouch');
  document.getElementById('btnSeat').onclick = () => applyPosture('seat');
  document.getElementById('btnChair').onclick = () => applyPosture('chair');
  document.getElementById('btnStand').onclick = () => applyPosture('stand');
  document.getElementById('btnPlayPosture').onclick = () => applyPosture('play');
  document.getElementById('btnGrid').onclick = () => { showGrid = !showGrid; drawGrid(); };
  document.getElementById('btnCube').onclick = () => { showCube = !showCube; applyPose(); };
  document.getElementById('btnCams').onclick = () => {
    camsEnabled = !camsEnabled;
    document.getElementById('btnCams').textContent = camsEnabled ? 'Cams on' : 'Cams';
    drawGrid();
    if (camsEnabled) refreshCams();
  };
  document.getElementById('btnPhoneCam').onclick = () => startPhoneCam();
  document.getElementById('btnRefreshTv').onclick = () => tvRefresh();
  document.getElementById('btnRecastTv').onclick = () => tvRecast();
  document.getElementById('btnPlay').onclick = () => tryPlay(true);
  document.getElementById('btnGlyph').onclick = () => cycleGlyphMode();
  // portal tap also plays
  document.getElementById('portal').addEventListener('click', () => tryPlay(true));
  document.getElementById('btnColor').onclick = () => {
    if (!colorOn) {
      colorOn = true;
      colorMode = 'complementary';
    } else {
      const modes = ['complementary', 'tertiary', 'primaries', 'grayscale', 'painting'];
      const i = modes.indexOf(colorMode);
      if (i >= modes.length - 1) {
        colorOn = false;
      } else {
        colorMode = modes[i + 1];
      }
    }
    document.getElementById('btnColor').classList.toggle('active', colorOn);
    document.getElementById('btnColor').textContent = colorOn ? ('Color · ' + colorMode) : 'Color test';
    paintColorPlate();
    pushViewer();
  };
  document.querySelectorAll('#bar [data-v]').forEach((b) => {
    b.onclick = () => setVariation(b.getAttribute('data-v'));
  });

  window.addEventListener('resize', () => { drawGrid(); applyPose(); });
  // Idle breathe ONLY when no live control for >3s (don't fight phone pose)
  let idle = 0;
  function tick() {
    const liveRx = isTv && lastRemotePoseAt && (Date.now() - lastRemotePoseAt < 3000);
    if (isTv && !liveRx) {
      idle += 0.008;
      // very subtle so user can still tell phone is not connected
      viewer.yaw = Math.sin(idle) * 0.05;
      viewer.pitch = Math.cos(idle * 0.7) * 0.03;
      viewer.roll = 0;
      viewer.source = 'idle';
      applyPose();
    }
    requestAnimationFrame(tick);
  }

  // PWA shell (Memory Glass–style): register SW only on secure context
  if (!isTv && window.isSecureContext && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
  }
  // Install hint when launched from QR over HTTPS
  if (!isTv && /pwa=1|install=1/.test(location.search)) {
    const ban = document.createElement('div');
    ban.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:60;background:#163848;border:1px solid #2a6a96;border-radius:10px;padding:.55rem .75rem;font:600 12px system-ui;color:#cfefff';
    ban.innerHTML = window.isSecureContext
      ? 'Secure ✓ · Share → <b>Add to Home Screen</b> for app chrome · then Allow Camera'
      : 'Open the <b>https://</b> QR (port 8792) — http is not a streaming app context';
    document.body.appendChild(ban);
    setTimeout(function () { try { ban.remove(); } catch (_) {} }, 12000);
  }

  drawGrid();
  applyPose();
  paintColorPlate();
  applyUser('you');
  applyPosture('seat', false);
  // living forest default on TV wall for depth
  if (isTv || /forest=1/.test(location.search)) setVariation('forest', false);
  loadGlyphAddresses();
  pullClock();
  setInterval(pullClock, 500); // match terminal clock refresh feel
  wireL3Controls();
  pullTranscript();
  setInterval(pullTranscript, 700); // live caption bus → L3
  // phone PWA: try gyro+geo without cam-relay (no spool thrash)
  if (!isTv && (window.isSecureContext || /pwa=1/.test(location.search))) {
    enableGyro(false);
    enableGeo();
  }
  // Chrome / Safari / Firefox + ?device= DevTools-style presets
  if (window.FCDevice) {
    FCDevice.bootFromQuery().catch(function () {});
  }
  tick();
  refreshCams();
  setInterval(refreshCams, 900);
  setInterval(() => { if (camsEnabled) layoutCams(); }, 220);
  // refresh QR if LAN/hub changes (rare)
  setInterval(loadGlyphAddresses, 30000);
  if (isTv) {
    // seed reload token so we don't reload on first poll
    fetch('/api/state', { cache: 'no-store' })
      .then((r) => r.json())
      .then((st) => {
        if (st.tv_cmd && st.tv_cmd.reload_token != null) {
          lastReloadToken = st.tv_cmd.reload_token;
        }
        applyRemoteState(st, true);
      })
      .catch(() => {})
      .finally(() => {
        startSse();
        pullLoop();
      });
  } else {
    // control: push on every move; heartbeat keeps TV matched
    viewer.source = 'pointer';
    pushViewer();
    pushCamMap();
    setInterval(() => {
      // always push so TV RX seq advances and matches
      if (!viewer.source || viewer.source === 'init') viewer.source = 'pointer';
      pushViewer();
    }, 100);
  }
})();
</script>
</body>
</html>
