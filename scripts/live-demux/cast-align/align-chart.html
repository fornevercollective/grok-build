<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cast Align · pixel chart</title>
  <style>
    :root {
      --bg: #0c0e14;
      --panel: #141820;
      --ink: #e8ecf2;
      --muted: #8b93a7;
      --line: #3a4256;
      --accent: #50c8ff;
      --sel: #ffdc50;
      --safe: #28b478;
      --danger: #ff5050;
      --cell-a: #1c2434;
      --cell-b: #121622;
      --font: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --sans: "Instrument Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: var(--sans);
    }
    body {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100dvh;
    }
    body.tv {
      grid-template-rows: 1fr;
    }
    header {
      display: flex; flex-wrap: wrap; gap: .5rem .75rem;
      align-items: center;
      padding: .55rem .75rem;
      background: var(--panel);
      border-bottom: 1px solid #1e2430;
      z-index: 5;
    }
    header h1 {
      font-size: .85rem; font-weight: 600; margin: 0 0.5rem 0 0;
      letter-spacing: .02em; white-space: nowrap;
    }
    header h1 span { color: var(--accent); font-weight: 500; }
    .ctrl {
      display: flex; flex-wrap: wrap; gap: .4rem .55rem; align-items: center;
      font-size: .72rem; color: var(--muted);
    }
    .ctrl label { display: inline-flex; align-items: center; gap: .25rem; }
    .ctrl input[type="number"], .ctrl select, .ctrl input[type="text"] {
      background: #0a0c12; color: var(--ink);
      border: 1px solid var(--line); border-radius: 4px;
      padding: .2rem .35rem; font: inherit; min-width: 3.2rem;
    }
    .ctrl input[type="text"] { min-width: 8rem; }
    .ctrl input[type="number"] { width: 3.6rem; }
    button, .btn {
      font: inherit; font-size: .72rem;
      background: #1a2230; color: var(--ink);
      border: 1px solid var(--line); border-radius: 5px;
      padding: .28rem .55rem; cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: #fff; }
    button.primary { background: #163048; border-color: #2a6a96; color: #cfefff; }
    button.danger { border-color: #803030; color: #ffb0b0; }
    button.active { background: #3a3020; border-color: var(--sel); color: var(--sel); }
    #stage-wrap {
      position: relative;
      overflow: auto;
      display: grid;
      place-items: center;
      padding: .5rem;
      background:
        radial-gradient(ellipse at center, #12151c 0%, var(--bg) 70%);
    }
    #stage {
      position: relative;
      box-shadow: 0 0 0 1px #222836, 0 12px 40px rgba(0,0,0,.45);
      touch-action: none;
      user-select: none;
    }
    #stage canvas { display: block; width: 100%; height: 100%; }
    footer {
      display: flex; flex-wrap: wrap; gap: .5rem .75rem;
      align-items: flex-start;
      padding: .5rem .75rem;
      background: var(--panel);
      border-top: 1px solid #1e2430;
      font-family: var(--font);
      font-size: .7rem;
      color: var(--muted);
    }
    #out {
      flex: 1 1 280px;
      min-height: 3.2rem;
      max-height: 8rem;
      overflow: auto;
      white-space: pre-wrap;
      background: #0a0c12;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: .4rem .5rem;
      color: #c8d0e0;
    }
    #hint { max-width: 22rem; line-height: 1.35; }
    kbd {
      font-family: var(--font); font-size: .65rem;
      border: 1px solid var(--line); border-radius: 3px;
      padding: 0 .25rem; background: #0a0c12;
    }
    @media (max-width: 720px) {
      header { gap: .35rem; }
      #hint { display: none; }
    }
    /* TV / cast full-bleed mode — interactive HTML surface (not MP4) */
    body.tv header, body.tv footer { display: none; }
    body.tv #refs { display: none; }
    body.tv #stage-wrap { padding: 0; }
    body.tv #stage {
      width: 100vw !important;
      height: 100vh !important;
      box-shadow: none;
    }
    body.control #hint .tv-only { display: none; }
    #sync-dot {
      width: .55rem; height: .55rem; border-radius: 50%;
      background: #555; display: inline-block; margin-right: .35rem;
    }
    #sync-dot.on { background: #28b478; box-shadow: 0 0 6px #28b478; }
    #sync-dot.err { background: #ff5050; }
    #refs {
      display: flex; flex-wrap: wrap; gap: .35rem .6rem;
      padding: .35rem .75rem;
      background: #0e121a;
      border-bottom: 1px solid #1e2430;
      font-size: .68rem;
    }
    #refs a {
      color: #8ec8ff; text-decoration: none;
      border: 1px solid #2a3a50; border-radius: 4px;
      padding: .15rem .4rem;
    }
    #refs a:hover { border-color: var(--accent); color: #fff; }
    #refs .lbl { color: var(--muted); margin-right: .25rem; }
  </style>
</head>
<body>
  <header>
    <h1>CAST ALIGN <span>· interactive surface</span></h1>
    <div class="ctrl">
      <span id="sync-dot" title="hub sync"></span>
      <label>W <input id="w" type="number" value="1920" min="320" step="2" /></label>
      <label>H <input id="h" type="number" value="1080" min="240" step="2" /></label>
      <label>cols <input id="cols" type="number" value="8" min="1" max="48" /></label>
      <label>rows <input id="rows" type="number" value="4" min="1" max="32" /></label>
      <label>labels
        <select id="labels">
          <option value="number">1…N</option>
          <option value="chess">A1…</option>
          <option value="rc">r1c1</option>
          <option value="both">both</option>
        </select>
      </label>
      <label>safe% <input id="safe" type="number" value="5" min="0" max="20" step="0.5" /></label>
      <label>select <input id="selectSpec" type="text" placeholder="1,2,5-8,A3" title="Numbers, ranges, chess" /></label>
      <button type="button" id="btnApply" class="primary">Apply</button>
      <button type="button" id="btnClear">Clear sel</button>
      <button type="button" id="btnInvert">Invert</button>
      <button type="button" id="btnExport">Export JSON</button>
      <button type="button" id="btnPng">Save PNG</button>
      <button type="button" id="btnTv">TV mode</button>
      <button type="button" id="btnCopy">Copy placement</button>
      <button type="button" id="btnPush" class="primary" title="Push selection to TV via hub">Push TV</button>
    </div>
  </header>

  <div id="refs">
    <span class="lbl">spatial later ·</span>
    <a href="https://github.com/superxslam/SuperMap" target="_blank" rel="noopener">SuperMap</a>
    <a href="https://csprofkgd.github.io/parallel-stereo-visualization/" target="_blank" rel="noopener">Parallel Stereo</a>
    <a href="https://syntec-research.github.io/SHELLS/" target="_blank" rel="noopener">SHELLS</a>
  </div>

  <div id="stage-wrap">
    <div id="stage"><canvas id="c"></canvas></div>
  </div>

  <footer>
    <div id="hint">
      <strong>Interactive</strong> (not MP4) · click cell · <kbd>Shift</kbd> drag region ·
      arrows move focus · <kbd>Space</kbd>/<kbd>Enter</kbd> toggle ·
      phone controls TV via hub sync · snap a pic of the grid.
    </div>
    <div id="out">select cells…</div>
  </footer>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const ctx = canvas.getContext('2d');
  const stage = $('stage');

  const state = {
    w: 1920, h: 1080,
    cols: 8, rows: 4,
    labels: 'number',
    safePct: 0.05,
    selected: new Set(),
    focus: 1,
    gutter: 28,
    drag: null, // {c0,r0,c1,r1, additive}
    mode: 'control', // control | tv
    hub: true,
    lastPush: 0,
    lastPull: 0,
  };

  const syncDot = () => $('sync-dot');

  // URL params: ?w=1920&h=1080&cols=8&rows=4&labels=number&select=1,2,5&tv=1
  function loadParams() {
    const u = new URL(location.href);
    const g = (k, d) => u.searchParams.get(k) ?? d;
    state.w = +g('w', 1920);
    state.h = +g('h', 1080);
    state.cols = +g('cols', 8);
    state.rows = +g('rows', 4);
    state.labels = g('labels', 'number');
    state.safePct = (+g('safe', 5)) / 100;
    const sel = g('select', '');
    if (sel) applySelectSpec(sel);
    if (g('tv', '') === '1' || g('cast', '') === '1') {
      document.body.classList.add('tv');
      state.mode = 'tv';
    }
    if (g('control', '') === '1') {
      document.body.classList.add('control');
      state.mode = 'control';
    }
    if (g('nohub', '') === '1') state.hub = false;
    $('w').value = state.w;
    $('h').value = state.h;
    $('cols').value = state.cols;
    $('rows').value = state.rows;
    $('labels').value = state.labels;
    $('safe').value = state.safePct * 100;
    if (sel) $('selectSpec').value = sel;
  }

  function hubPayload() {
    return {
      w: state.w,
      h: state.h,
      cols: state.cols,
      rows: state.rows,
      labels: state.labels,
      safe: state.safePct * 100,
      selected: [...state.selected].sort((a, b) => a - b),
      focus: state.focus,
      controller: state.mode,
      title: 'CAST ALIGN · interactive',
    };
  }

  function applyHubState(st) {
    if (!st || typeof st !== 'object') return;
    if (st.w) state.w = +st.w;
    if (st.h) state.h = +st.h;
    if (st.cols) state.cols = +st.cols;
    if (st.rows) state.rows = +st.rows;
    if (st.labels) state.labels = st.labels;
    if (st.safe != null) state.safePct = (+st.safe) / 100;
    if (Array.isArray(st.selected)) state.selected = new Set(st.selected.map(Number));
    if (st.focus) state.focus = +st.focus;
    // mirror into controls if visible
    if ($('w') && !document.body.classList.contains('tv')) {
      $('w').value = state.w;
      $('h').value = state.h;
      $('cols').value = state.cols;
      $('rows').value = state.rows;
      $('labels').value = state.labels;
      $('safe').value = state.safePct * 100;
      $('selectSpec').value = [...state.selected].sort((a, b) => a - b).join(',');
    }
  }

  async function pushHub() {
    if (!state.hub) return;
    try {
      const r = await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(hubPayload()),
      });
      if (!r.ok) throw new Error('push ' + r.status);
      state.lastPush = Date.now();
      if (syncDot()) { syncDot().classList.remove('err'); syncDot().classList.add('on'); }
    } catch (e) {
      if (syncDot()) { syncDot().classList.remove('on'); syncDot().classList.add('err'); }
    }
  }

  async function pullHubOnce() {
    if (!state.hub) return null;
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (!r.ok) throw new Error('pull ' + r.status);
      const st = await r.json();
      state.lastPull = Date.now();
      if (syncDot()) { syncDot().classList.remove('err'); syncDot().classList.add('on'); }
      return st;
    } catch (e) {
      if (syncDot()) { syncDot().classList.remove('on'); syncDot().classList.add('err'); }
      return null;
    }
  }

  function startHubLoop() {
    if (!state.hub) return;
    // TV long-polls; control also polls so multi-phone stays in sync
    const loop = async () => {
      try {
        const since = state._hubUpdated || 0;
        const url = state.mode === 'tv'
          ? '/api/long-poll?since=' + encodeURIComponent(since)
          : '/api/state';
        const r = await fetch(url, { cache: 'no-store' });
        if (r.ok) {
          const st = await r.json();
          const u = +st.updated || 0;
          if (u > (state._hubUpdated || 0)) {
            // TV always applies; control applies if not just pushed
            if (state.mode === 'tv' || Date.now() - state.lastPush > 400) {
              applyHubState(st);
              draw();
            }
            state._hubUpdated = u;
          }
          if (syncDot()) { syncDot().classList.remove('err'); syncDot().classList.add('on'); }
        }
      } catch (e) {
        if (syncDot()) { syncDot().classList.remove('on'); syncDot().classList.add('err'); }
      }
      setTimeout(loop, state.mode === 'tv' ? 50 : 800);
    };
    pullHubOnce().then((st) => {
      if (st) {
        applyHubState(st);
        state._hubUpdated = +st.updated || 0;
        draw();
      }
      loop();
    });
  }

  function afterSelectChange() {
    draw();
    if (state.mode !== 'tv') pushHub();
  }

  function colLetter(i) {
    let n = i + 1, s = '';
    while (n) {
      const r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function cellLabel(idx, c, r) {
    if (state.labels === 'chess') return colLetter(c) + (r + 1);
    if (state.labels === 'rc') return 'r' + (r + 1) + 'c' + (c + 1);
    if (state.labels === 'both') return idx + '\n' + colLetter(c) + (r + 1);
    return String(idx);
  }

  function geom() {
    const { w, h, cols, rows } = state;
    const gutter = Math.max(28, Math.floor(Math.min(w, h) / 40));
    state.gutter = gutter;
    const gx0 = gutter, gy0 = gutter;
    const gw = w - 2 * gutter, gh = h - 2 * gutter;
    const cw = gw / cols, ch = gh / rows;
    return { gx0, gy0, gw, gh, cw, ch, gutter };
  }

  function cellAt(px, py) {
    const { gx0, gy0, cw, ch } = geom();
    const { cols, rows, w, h } = state;
    if (px < gx0 || py < gy0 || px >= w - state.gutter || py >= h - state.gutter) return null;
    const c = Math.min(cols - 1, Math.max(0, Math.floor((px - gx0) / cw)));
    const r = Math.min(rows - 1, Math.max(0, Math.floor((py - gy0) / ch)));
    return { c, r, n: r * cols + c + 1 };
  }

  function parseSelectSpec(spec) {
    const out = new Set();
    const { cols, rows } = state;
    const total = cols * rows;
    String(spec || '').split(/[\s,;]+/).filter(Boolean).forEach((part) => {
      let m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        const a = +m[1], b = +m[2];
        for (let n = Math.min(a, b); n <= Math.max(a, b); n++) {
          if (n >= 1 && n <= total) out.add(n);
        }
        return;
      }
      m = part.match(/^([A-Za-z]+)(\d+)$/);
      if (m) {
        let col = 0;
        for (const ch of m[1].toUpperCase()) col = col * 26 + (ch.charCodeAt(0) - 64);
        col -= 1;
        const row = +m[2] - 1;
        if (col >= 0 && col < cols && row >= 0 && row < rows) out.add(row * cols + col + 1);
        return;
      }
      m = part.match(/^[rR](\d+)[cC](\d+)$/);
      if (m) {
        const row = +m[1] - 1, col = +m[2] - 1;
        if (col >= 0 && col < cols && row >= 0 && row < rows) out.add(row * cols + col + 1);
        return;
      }
      if (/^\d+$/.test(part)) {
        const n = +part;
        if (n >= 1 && n <= total) out.add(n);
      }
    });
    return out;
  }

  function applySelectSpec(spec) {
    state.selected = parseSelectSpec(spec);
  }

  function cellsList() {
    const { cols, rows } = state;
    const { gx0, gy0, cw, ch } = geom();
    const list = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const n = r * cols + c + 1;
        const x = Math.round(gx0 + c * cw);
        const y = Math.round(gy0 + r * ch);
        const ww = Math.round(cw);
        const hh = Math.round(ch);
        list.push({
          n,
          label: cellLabel(n, c, r).replace('\n', ' '),
          row: r + 1,
          col: c + 1,
          chess: colLetter(c) + (r + 1),
          x, y, w: ww, h: hh,
          cx: x + Math.round(ww / 2),
          cy: y + Math.round(hh / 2),
          selected: state.selected.has(n),
        });
      }
    }
    return list;
  }

  function selectionBBox(cells) {
    const sel = cells.filter((c) => c.selected);
    if (!sel.length) return null;
    const x = Math.min(...sel.map((c) => c.x));
    const y = Math.min(...sel.map((c) => c.y));
    const x2 = Math.max(...sel.map((c) => c.x + c.w));
    const y2 = Math.max(...sel.map((c) => c.y + c.h));
    return { x, y, w: x2 - x, h: y2 - y, cells: sel.map((c) => c.n).sort((a, b) => a - b) };
  }

  function exportLayout() {
    const cells = cellsList();
    const { w, h, cols, rows, labels, safePct, gutter } = state;
    const sx = w * safePct, sy = h * safePct;
    return {
      version: 1,
      kind: 'cast-align-chart',
      width: w,
      height: h,
      cols,
      rows,
      labels,
      gutter,
      safe_pct: safePct,
      safe_box: { x: Math.round(sx), y: Math.round(sy), w: Math.round(w - 2 * sx), h: Math.round(h - 2 * sy) },
      cells,
      selected: [...state.selected].sort((a, b) => a - b),
      selection_bbox: selectionBBox(cells),
      placement_hint: 'Use cell n / chess / x,y,w,h for wall tile placement.',
    };
  }

  function fitStage() {
    const wrap = $('stage-wrap');
    const maxW = wrap.clientWidth - 8;
    const maxH = wrap.clientHeight - 8;
    const scale = Math.min(maxW / state.w, maxH / state.h, 1.5);
    const dw = Math.floor(state.w * scale);
    const dh = Math.floor(state.h * scale);
    stage.style.width = dw + 'px';
    stage.style.height = dh + 'px';
  }

  function draw() {
    const { w, h, cols, rows, safePct } = state;
    canvas.width = w;
    canvas.height = h;
    fitStage();

    const { gx0, gy0, cw, ch, gutter } = geom();

    // bg
    ctx.fillStyle = '#0c0e14';
    ctx.fillRect(0, 0, w, h);

    // cells
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const n = r * cols + c + 1;
        const x0 = gx0 + c * cw;
        const y0 = gy0 + r * ch;
        let base = (r + c) % 2 === 0 ? '#1c2434' : '#121622';
        if (state.selected.has(n)) base = '#2a5a72';
        // drag preview
        if (state.drag) {
          const { c0, r0, c1, r1 } = state.drag;
          const cmin = Math.min(c0, c1), cmax = Math.max(c0, c1);
          const rmin = Math.min(r0, r1), rmax = Math.max(r0, r1);
          if (c >= cmin && c <= cmax && r >= rmin && r <= rmax) base = '#3a6040';
        }
        ctx.fillStyle = base;
        ctx.fillRect(x0, y0, cw, ch);

        const label = cellLabel(n, c, r);
        const numSize = Math.max(18, Math.floor(Math.min(cw, ch) * 0.28));
        ctx.fillStyle = state.selected.has(n) ? '#101418' : '#f0f4fa';
        ctx.font = `600 ${numSize}px "IBM Plex Mono", ui-monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lines = label.split('\n');
        lines.forEach((ln, i) => {
          const yy = y0 + ch / 2 + (i - (lines.length - 1) / 2) * (numSize * 1.05);
          ctx.fillText(ln, x0 + cw / 2, yy);
        });

        const tiny = Math.max(11, Math.floor(Math.min(cw, ch) * 0.1));
        ctx.font = `${tiny}px ui-monospace, monospace`;
        ctx.fillStyle = '#5a6478';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(`${Math.round(x0)},${Math.round(y0)}`, x0 + 4, y0 + 3);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`${Math.round(cw)}×${Math.round(ch)}`, x0 + cw - 5, y0 + ch - 4);
      }
    }

    // grid lines
    for (let c = 0; c <= cols; c++) {
      const x = gx0 + c * cw;
      ctx.strokeStyle = c % 2 === 0 ? '#5a6478' : '#3a4256';
      ctx.lineWidth = c % 2 === 0 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x, gy0); ctx.lineTo(x, gy0 + rows * ch); ctx.stroke();
    }
    for (let r = 0; r <= rows; r++) {
      const y = gy0 + r * ch;
      ctx.strokeStyle = r % 2 === 0 ? '#5a6478' : '#3a4256';
      ctx.lineWidth = r % 2 === 0 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(gx0, y); ctx.lineTo(gx0 + cols * cw, y); ctx.stroke();
    }

    // selection outlines
    state.selected.forEach((n) => {
      const r = Math.floor((n - 1) / cols);
      const c = (n - 1) % cols;
      const x0 = gx0 + c * cw, y0 = gy0 + r * ch;
      ctx.strokeStyle = '#ffdc50';
      ctx.lineWidth = 3;
      ctx.strokeRect(x0 + 2, y0 + 2, cw - 4, ch - 4);
    });

    // focus ring (interactive navigation)
    if (state.focus >= 1 && state.focus <= cols * rows) {
      const fr = Math.floor((state.focus - 1) / cols);
      const fc = (state.focus - 1) % cols;
      const x0 = gx0 + fc * cw, y0 = gy0 + fr * ch;
      ctx.strokeStyle = '#50c8ff';
      ctx.lineWidth = 4;
      ctx.strokeRect(x0 + 6, y0 + 6, cw - 12, ch - 12);
    }

    // safe area
    const sx = w * safePct, sy = h * safePct;
    ctx.strokeStyle = '#28b478';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, w - 2 * sx, h - 2 * sy);
    ctx.fillStyle = '#28b478';
    ctx.font = `${Math.max(12, gutter * 0.4)}px ui-monospace, monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`SAFE ${Math.round((1 - 2 * safePct) * 100)}% action`, sx + 6, sy + 4);

    // title
    ctx.fillStyle = '#080a0e';
    ctx.fillRect(gutter, 2, w - 2 * gutter, gutter - 4);
    ctx.fillStyle = '#c8d0e0';
    ctx.font = `${Math.max(12, gutter * 0.42)}px ui-monospace, monospace`;
    const modeTag = state.mode === 'tv' ? 'LIVE SURFACE' : 'CONTROL';
    ctx.fillText(
      `CAST ALIGN · ${modeTag} · ${w}×${h} · ${cols}×${rows} · cell ~${Math.round(cw)}×${Math.round(ch)}px · focus ${state.focus}`,
      gutter + 4, 8
    );

    // center cross
    const cx = w / 2, cy = h / 2, arm = Math.max(24, Math.min(w, h) / 30);
    ctx.strokeStyle = '#ffc83c';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - arm, cy); ctx.lineTo(cx + arm, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - arm); ctx.lineTo(cx, cy + arm); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ffc83c';
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillText(`center ${cx | 0},${cy | 0}`, cx + 8, cy + 14);

    // corner brackets
    const br = Math.max(40, Math.min(w, h) / 25);
    ctx.strokeStyle = '#ff5050';
    ctx.lineWidth = 3;
    [[0, 0, 1, 1], [w - 1, 0, -1, 1], [0, h - 1, 1, -1], [w - 1, h - 1, -1, -1]].forEach(([ox, oy, hx, hy]) => {
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + hx * br, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy + hy * br); ctx.stroke();
    });

    // rulers
    ctx.strokeStyle = '#c8d0e0';
    ctx.fillStyle = '#c8d0e0';
    ctx.lineWidth = 1;
    ctx.font = '11px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    for (let x = 0; x < w; x += 20) {
      const ln = x % 100 === 0 ? 16 : 8;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ln); ctx.stroke();
      if (x % 100 === 0 && x > 0) ctx.fillText(String(x), x + 2, ln + 1);
    }
    for (let y = 0; y < h; y += 20) {
      const ln = y % 100 === 0 ? 16 : 8;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ln, y); ctx.stroke();
      if (y % 100 === 0 && y > 0) ctx.fillText(String(y), ln + 2, y - 6);
    }

    // selection summary strip
    if (state.selected.size) {
      const sorted = [...state.selected].sort((a, b) => a - b);
      let summary = 'SEL: ' + sorted.slice(0, 24).join(',');
      if (sorted.length > 24) summary += `… (+${sorted.length - 24})`;
      ctx.fillStyle = '#080a0e';
      ctx.fillRect(gutter, h - gutter + 2, w - 2 * gutter, gutter - 6);
      ctx.fillStyle = '#50c8ff';
      ctx.font = `${Math.max(12, gutter * 0.4)}px ui-monospace, monospace`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(summary, gutter + 4, h - gutter + 8);
    }

    updateOut();
  }

  function updateOut() {
    const layout = exportLayout();
    const bbox = layout.selection_bbox;
    const lines = [
      `frame ${layout.width}×${layout.height}  grid ${layout.cols}×${layout.rows}`,
      layout.selected.length
        ? `selected [${layout.selected.join(', ')}]`
        : 'selected []  (click cells or type 1,2,5-8,A3)',
    ];
    if (bbox) {
      lines.push(`bbox x=${bbox.x} y=${bbox.y} w=${bbox.w} h=${bbox.h}`);
      lines.push(`ffmpeg crop=${bbox.w}:${bbox.h}:${bbox.x}:${bbox.y}`);
    }
    $('out').textContent = lines.join('\n');
  }

  function eventToPixel(ev) {
    const rect = canvas.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const x = ((clientX - rect.left) / rect.width) * state.w;
    const y = ((clientY - rect.top) / rect.height) * state.h;
    return { x, y };
  }

  function applyDragRegion(finalize) {
    if (!state.drag) return;
    const { c0, r0, c1, r1, additive } = state.drag;
    const cmin = Math.min(c0, c1), cmax = Math.max(c0, c1);
    const rmin = Math.min(r0, r1), rmax = Math.max(r0, r1);
    if (finalize) {
      if (!additive) state.selected.clear();
      for (let r = rmin; r <= rmax; r++) {
        for (let c = cmin; c <= cmax; c++) {
          state.selected.add(r * state.cols + c + 1);
        }
      }
      state.drag = null;
    }
  }

  let lastTap = 0;
  canvas.addEventListener('pointerdown', (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const { x, y } = eventToPixel(ev);
    const cell = cellAt(x, y);
    if (!cell) return;
    const now = Date.now();
    const dbl = now - lastTap < 320;
    lastTap = now;
    if (dbl) {
      state.selected = new Set([cell.n]);
      state.focus = cell.n;
      state.drag = null;
      afterSelectChange();
      return;
    }
    state.focus = cell.n;
    state.drag = {
      c0: cell.c, r0: cell.r, c1: cell.c, r1: cell.r,
      additive: ev.shiftKey || ev.metaKey || ev.ctrlKey,
      moved: false,
      startN: cell.n,
    };
    draw();
  });

  canvas.addEventListener('pointermove', (ev) => {
    if (!state.drag) return;
    const { x, y } = eventToPixel(ev);
    const cell = cellAt(x, y);
    if (!cell) return;
    if (cell.c !== state.drag.c1 || cell.r !== state.drag.r1) {
      state.drag.c1 = cell.c;
      state.drag.r1 = cell.r;
      state.drag.moved = true;
      draw();
    }
  });

  function endPointer(ev) {
    if (!state.drag) return;
    if (!state.drag.moved) {
      // toggle single cell
      const n = state.drag.startN;
      if (state.drag.additive) {
        if (state.selected.has(n)) state.selected.delete(n);
        else state.selected.add(n);
      } else {
        if (state.selected.has(n) && state.selected.size === 1) state.selected.delete(n);
        else {
          // toggle within multi: if only this one selected already handled
          if (state.selected.has(n)) state.selected.delete(n);
          else state.selected.add(n);
        }
      }
      state.drag = null;
    } else {
      applyDragRegion(true);
    }
    afterSelectChange();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', () => { state.drag = null; draw(); });

  function readControls() {
    state.w = Math.max(320, +$('w').value || 1920);
    state.h = Math.max(240, +$('h').value || 1080);
    state.cols = Math.max(1, Math.min(48, +$('cols').value || 8));
    state.rows = Math.max(1, Math.min(32, +$('rows').value || 4));
    state.labels = $('labels').value;
    state.safePct = Math.max(0, Math.min(0.2, (+$('safe').value || 5) / 100));
    // drop out-of-range selections
    const total = state.cols * state.rows;
    state.selected = new Set([...state.selected].filter((n) => n >= 1 && n <= total));
    const spec = $('selectSpec').value.trim();
    if (spec) {
      applySelectSpec(spec);
    }
  }

  $('btnApply').onclick = () => { readControls(); afterSelectChange(); };
  $('btnClear').onclick = () => { state.selected.clear(); $('selectSpec').value = ''; afterSelectChange(); };
  $('btnInvert').onclick = () => {
    const total = state.cols * state.rows;
    const next = new Set();
    for (let n = 1; n <= total; n++) if (!state.selected.has(n)) next.add(n);
    state.selected = next;
    afterSelectChange();
  };
  if ($('btnPush')) $('btnPush').onclick = () => { pushHub(); };
  $('btnExport').onclick = () => {
    const data = JSON.stringify(exportLayout(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'align-chart.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $('btnPng').onclick = () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `align-chart-${state.w}x${state.h}.png`;
    a.click();
  };
  $('btnTv').onclick = () => {
    document.body.classList.toggle('tv');
    fitStage();
    draw();
  };
  $('btnCopy').onclick = async () => {
    const layout = exportLayout();
    const text = JSON.stringify(layout.selection_bbox || layout.selected, null, 2);
    try {
      await navigator.clipboard.writeText(text);
      $('out').textContent = ( $('out').textContent || '' ) + '\n(copied placement)';
    } catch {
      $('out').textContent = text;
    }
  };

  // live-update on enter in select field
  $('selectSpec').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { readControls(); afterSelectChange(); }
  });

  window.addEventListener('resize', () => { fitStage(); draw(); });

  // keyboard: arrows / space + 1-9 (interactive surface)
  window.addEventListener('keydown', (e) => {
    if (e.target.matches('input, select, textarea')) return;
    const total = state.cols * state.rows;
    const moveFocus = (dc, dr) => {
      let c = (state.focus - 1) % state.cols;
      let r = Math.floor((state.focus - 1) / state.cols);
      c = Math.max(0, Math.min(state.cols - 1, c + dc));
      r = Math.max(0, Math.min(state.rows - 1, r + dr));
      state.focus = r * state.cols + c + 1;
      draw();
      if (state.mode !== 'tv') pushHub();
    };
    if (e.key === 'ArrowLeft') { e.preventDefault(); moveFocus(-1, 0); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); moveFocus(1, 0); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(0, -1); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(0, 1); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      const n = state.focus;
      if (state.selected.has(n)) state.selected.delete(n);
      else state.selected.add(n);
      afterSelectChange();
      return;
    }
    if (e.key === 'Escape') { state.selected.clear(); afterSelectChange(); return; }
    if (e.key === 'a' && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      state.selected = new Set(Array.from({ length: total }, (_, i) => i + 1));
      afterSelectChange();
      return;
    }
    if (/^[1-9]$/.test(e.key)) {
      const n = +e.key;
      if (n <= total) {
        state.focus = n;
        if (e.shiftKey) {
          if (state.selected.has(n)) state.selected.delete(n);
          else state.selected.add(n);
        } else {
          state.selected = new Set([n]);
        }
        afterSelectChange();
      }
    }
  });

  loadParams();
  // fill canvas to viewport in tv mode using actual display size when possible
  if (state.mode === 'tv') {
    state.w = Math.max(state.w, window.innerWidth || state.w);
    state.h = Math.max(state.h, window.innerHeight || state.h);
    // keep even dims
    state.w -= state.w % 2;
    state.h -= state.h % 2;
  }
  draw();
  startHubLoop();
  // seed hub so TV has something immediately
  if (state.mode === 'control') pushHub();
})();
</script>
</body>
</html>
